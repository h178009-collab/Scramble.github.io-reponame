&lt;style&gt;
  :root{
    --bg: #14161b;
    --surface: #1b1e25;
    --surface-2: #22252e;

  *{box-sizing:border-box;}

  .icon-btn{

    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;

  /* scramble */
  .scramble-bar{

  .stage{

  .stage.pb-flash{ animation: pbGlow 1.1s ease-out; }
  @keyframes pbGlow{

  /* facelet signature strip */
  .facelets{

  .facelet{
    width:14px;height:14px;

  .facelet:nth-child(1){ --sc: var(--sticker-white); }
  .facelet:nth-child(2){ --sc: var(--sticker-yellow); }
  .facelet:nth-child(3){ --sc: var(--sticker-red); }
  .facelet:nth-child(4){ --sc: var(--sticker-orange); }
  .facelet:nth-child(5){ --sc: var(--sticker-blue); }
  .facelet:nth-child(6){ --sc: var(--sticker-green); }

  .state-holding .facelet{ background:var(--red); border-color:var(--red); animation:pulse .5s ease-in-out infinite; }
  .state-inspecting .facelet{ background:var(--yellow); border-color:var(--yellow); animation:pulse .9s ease-in-out infinite; }
  .state-ready .facelet{ background:var(--accent); border-color:var(--accent); transform:scale(1.08); }
  .state-running .facelet{ background:var(--sc); border-color:var(--sc); animation:chase 1.1s ease-in-out infinite; }
  .state-running .facelet:nth-child(1){ animation-delay:0s; }
  .state-running .facelet:nth-child(2){ animation-delay:.08s; }
  .state-running .facelet:nth-child(3){ animation-delay:.16s; }
  .state-running .facelet:nth-child(4){ animation-delay:.24s; }
  .state-running .facelet:nth-child(5){ animation-delay:.32s; }
  .state-running .facelet:nth-child(6){ animation-delay:.4s; }
  .state-stopped .facelet{ background:var(--sc); border-color:var(--sc); }

  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  @keyframes chase{ 0%,100%{opacity:.3; transform:translateY(0);} 50%{opacity:1; transform:translateY(-3px);} }

  /* penalty row */
  .penalty-row{

  .pbtn:hover{ color:var(--text); border-color:#3a3f4b; }

  .pbtn.active[data-p=&quot;dnf&quot;]{ background:rgba(217,70,60,.15); border-color:var(--red); color:var(--red); }

  .panel{

  .panel-title{
    font-size:11px;

  .pattern-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 6px;
    border-bottom:1px solid var(--border);

  .pattern-row:last-child{ border-bottom:none; }
  .pattern-info{ min-width:0; flex:1; }
  .pattern-name{ font-size:13px; font-weight:700; color:var(--text); }

  .pattern-use{

  svg#graph{ width:100%; height:180px; display:block; }

  /* settings drawer */
  .drawer-backdrop{

  .setting-row{
    display:flex; align-items:center; justify-content:space-between;

  }

  select.inspect-select{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:5px 8px; font-size:12px;
  }
  .swatches{ display:flex; gap:6px; }
  .swatch{
    width:20px; height:20px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; padding:0;
  }
  .swatch.active{ border-color:#fff; }
  .drawer-btn{
    font-family:var(--font-body); font-weight:700; font-size:12px;
    padding:8px 12px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-dim); cursor:pointer; flex-shrink:0;
  }
  .drawer-btn:hover{ color:var(--text); border-color:#3a3f4b; }
  .drawer-section-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint);

  .kbd-hints{ font-size:11px; color:var(--text-faint); line-height:1.8; margin-top:6px; }
  .kbd-hints b{ color:var(--text-dim); font-family:var(--font-display); }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  .hint{
    text-align:center; color:var(--text-faint); font-size:12px; margin-top:16px;
  }

  #undoToast.show{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }

  .app.zen .header-controls select#puzzle,
  .app.zen .panels,
  .app.zen .stats,
  .app.zen .hint{ display:none !important; }
  .app.zen .scramble-bar{ margin-bottom:14px; }
  .app.zen .stage{ min-height:60vh; }

  .today-goal{
    display:flex; align-items:center; gap:8px; margin-top:6px; font-size:10px; color:var(--text-faint);

  .app.compact .stage{ padding:20px 16px; min-height:220px; }
  .app.compact .timer-readout{ font-size:clamp(40px, 9vw, 72px); }
  .app.compact .panels{ gap:8px; }
  .app.compact .panel{ padding:10px; }
  .app.compact .stats{ margin:10px 0; }

  .app.colorblind .facelet:nth-child(1)::after{ content:'○'; }
  .app.colorblind .facelet:nth-child(2)::after{ content:'△'; }
  .app.colorblind .facelet:nth-child(3)::after{ content:'✕'; }
  .app.colorblind .facelet:nth-child(4)::after{ content:'◇'; }
  .app.colorblind .facelet:nth-child(5)::after{ content:'□'; }
  .app.colorblind .facelet:nth-child(6)::after{ content:'✦'; }
  .app.colorblind .facelet{ position:relative; display:flex; align-items:center; justify-content:center; }
  .app.colorblind .facelet::after{ font-size:9px; color:var(--bg); line-height:1; }

  .time-row.row-best .val{ color:var(--accent); }
  .time-row.row-worst .val{ color:var(--red); }
  .time-row .val{ cursor:pointer; }
  .today-best-tag{
    font-family:var(--font-body); font-size:9px; font-weight:800; letter-spacing:.3px;
    color:var(--accent); background:rgba(76,175,109,.15); padding:1px 5px; border-radius:4px;
  }
&lt;/style&gt;

&lt;script&gt;
(function(){
  &quot;use strict&quot;;

  // ================= Puzzle config =================
  const PUZZLES = [&quot;2x2x2&quot;,&quot;3x3x3&quot;,&quot;4x4x4&quot;,&quot;5x5x5&quot;,&quot;6x6x6&quot;,&quot;7x7x7&quot;,&quot;Pyraminx&quot;,&quot;Skewb&quot;,&quot;Megaminx&quot;,&quot;Square-1&quot;];
  const puzzleSelect = document.getElementById('puzzle');
  PUZZLES.forEach(p=&gt;{
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    puzzleSelect.appendChild(o);
  });

  const STORE_KEY = 'sub-timer-data-v2';
  const OLD_STORE_KEY = 'sub-timer-data-v1';

  const PATTERNS_BY_PUZZLE = {
    '2x2x2': [
      { name: 'Two-Tone Blocks', alg: &quot;F2 R2&quot; },
      { name: 'Diagonal Blocks', alg: &quot;R2 U2&quot; },
    ],
    '3x3x3': [
      { name: 'Superflip', alg: &quot;U R2 F B R B2 R U2 L B2 R U' D' R2 F R' L B2 U2 F2&quot; },
      { name: 'Checkerboard', alg: &quot;F2 B2 U2 D2 L2 R2&quot; },
      { name: 'Facing Checkerboards', alg: &quot;U2 F2 U2 F2 B2 U2 F2 D2&quot; },
      { name: 'Six Spot', alg: &quot;R2 L2 U B L2 D' F B2 R L' F' B R D F2 L' U'&quot; },
      { name: 'Four Spot', alg: &quot;F2 B2 U D' R2 L2 U D'&quot; },
      { name: 'Cube in a Cube', alg: &quot;F L F U' R U F2 L2 U' L' B D' B' L2 U&quot; },
      { name: 'Cube in a Cube in a Cube', alg: &quot;F' U B' R' U F2 U2 F' U' F U2 D B' D' R2 B2 U'&quot; },
      { name: 'Christmas Cross', alg: &quot;U F B' L2 U2 L2 F' B U2 L2 U&quot; },
      { name: &quot;Plummer's Cross&quot;, alg: &quot;R2 L' D F2 R' D' R' L U' D R D B2 R' U D2&quot; },
      { name: 'Stripes', alg: &quot;F U F R L2 B D' R D2 L D' B R2 L F U F&quot; },
      { name: 'Anaconda', alg: &quot;L U B' U' R L' B R' F B' D R D' F'&quot; },
      { name: 'Python', alg: &quot;F2 R' B' U R' L F' L F' B D' R B L2&quot; },
      { name: 'Black Mamba', alg: &quot;R D L F' R L' D R' U D' B U' R' D'&quot; },
      { name: 'Green Mamba', alg: &quot;R D R F R' F' B D R' U' B' U D2&quot; },
      { name: 'Tetris', alg: &quot;L R F B U' D' L' R'&quot; },
      { name: 'Magic Scramble', alg: &quot;R' F2 R2 B2 L U2 F2 D2 F2 U2 L' D2 B' L' D R F2 R2 U L U&quot; },
    ],
    '4x4x4': [
      { name: 'Checkerboard', alg: &quot;F2 B2 U2 D2 L2 R2&quot; },
      { name: 'Horizontal Stripes', alg: &quot;U2 D2&quot; },
      { name: 'Vertical Bands', alg: &quot;R2 L2&quot; },
    ],
    '5x5x5': [
      { name: 'Checkerboard', alg: &quot;F2 B2 U2 D2 L2 R2&quot; },
      { name: 'Horizontal Stripes', alg: &quot;U2 D2&quot; },
      { name: 'Vertical Bands', alg: &quot;R2 L2&quot; },
    ],
    '6x6x6': [
      { name: 'Checkerboard', alg: &quot;F2 B2 U2 D2 L2 R2&quot; },
      { name: 'Horizontal Stripes', alg: &quot;U2 D2&quot; },
      { name: 'Vertical Bands', alg: &quot;R2 L2&quot; },
    ],
    '7x7x7': [
      { name: 'Checkerboard', alg: &quot;F2 B2 U2 D2 L2 R2&quot; },
      { name: 'Horizontal Stripes', alg: &quot;U2 D2&quot; },
      { name: 'Vertical Bands', alg: &quot;R2 L2&quot; },
    ],
  };
  function currentPatterns(){
    return PATTERNS_BY_PUZZLE[currentPuzzle] || [];
  }

  const ACCENTS = ['#4caf6d', '#4a7fd6', '#c15fd6', '#e0668e', '#e8b83c', '#e0703c'];

  let store = loadStore();
  migrateStore();
  let currentPuzzle = store.lastPuzzle &amp;&amp; PUZZLES.includes(store.lastPuzzle) ? store.lastPuzzle : &quot;3x3x3&quot;;
  puzzleSelect.value = currentPuzzle;
  let graphMode = 'trend';

  function loadStore(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
      const oldRaw = localStorage.getItem(OLD_STORE_KEY);
      if(oldRaw) return JSON.parse(oldRaw);
    }catch(e){}
    return { lastPuzzle:&quot;3x3x3&quot;, sessions:{}, activeSession:{}, pbs:{}, settings:{ inspect:0, hideTime:false, sound:false, fru:false, accent: ACCENTS[0] } };
  }
  function saveStore(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  }
  function genId(){ return Math.random().toString(36).slice(2,9); }

  function migrateStore(){
    store.sessions = store.sessions || {};
    store.activeSession = store.activeSession || {};
    store.pbs = store.pbs || {};
    store.settings = store.settings || {};
    if(!store.settings.accent) store.settings.accent = ACCENTS[0];
    Object.keys(store.sessions).forEach(p=&gt;{
      const val = store.sessions[p];
      if(Array.isArray(val)){
        const isOldFlat = val.length === 0 || (val[0] &amp;&amp; typeof val[0].entries === 'undefined');
        if(isOldFlat){
          store.sessions[p] = [{ id: genId(), label: 'Session 1', entries: val, createdAt: Date.now() }];
        }
      }
    });
  }

  function getSessions(p){
    if(!store.sessions[p] || !store.sessions[p].length){
      store.sessions[p] = [{ id: genId(), label: 'Session 1', entries: [], createdAt: Date.now() }];
    }
    return store.sessions[p];
  }
  function getActiveSessionIdx(p){
    const list = getSessions(p);
    let id = store.activeSession[p];
    let idx = list.findIndex(s=&gt;s.id===id);
    if(idx === -1){ idx = list.length-1; store.activeSession[p] = list[idx].id; }
    return idx;
  }
  function sessionFor(p){
    const list = getSessions(p);
    const idx = getActiveSessionIdx(p);
    return list[idx].entries;
  }
  function allEntriesFor(p){
    return getSessions(p).reduce((acc,s)=&gt;acc.concat(s.entries), []);
  }
  function newSession(p){
    const list = getSessions(p);
    const s = { id: genId(), label: 'Session '+(list.length+1), entries: [], createdAt: Date.now() };
    list.push(s);
    store.activeSession[p] = s.id;
    saveStore();
  }

  // ================= Scramble generation =================
  const AXIS = { U:'y', D:'y', L:'x', R:'x', F:'z', B:'z' };
  function randInt(n){ return Math.floor(Math.random()*n); }
  function pick(arr){ return arr[randInt(arr.length)]; }

  function nxnScramble(size, length, fruOnly){
    const faces = fruOnly ? ['F','U','R'] : ['U','D','L','R','F','B'];
    const mods = ['', &quot;'&quot;, '2'];
    const moves = [];
    let lastFace = null, lastAxis = null, lastAxisCount = 0;
    const wideLetters = size &gt;= 4 &amp;&amp; !fruOnly;
    for(let i=0;i&lt;length;i++){
      let face;
      let attempts = 0;
      do{
        face = pick(faces);
        attempts++;
      } while((face===lastFace || (!fruOnly &amp;&amp; AXIS[face]===lastAxis &amp;&amp; lastAxisCount&gt;=2)) &amp;&amp; attempts &lt; 20);
      if(AXIS[face]===lastAxis) lastAxisCount++; else lastAxisCount = 1;
      lastFace = face; lastAxis = AXIS[face];
      let token = face;
      if(wideLetters &amp;&amp; size &gt;= 4 &amp;&amp; Math.random() &lt; 0.35){
        if(size &gt;= 5 &amp;&amp; Math.random() &lt; 0.4){
          const depth = 2 + randInt(size-3);
          token = depth + face + 'w';
        } else {
          token = face + 'w';
        }
      }
      token += pick(mods);
      moves.push(token);
    }
    return moves.join(' ');
  }

  function pyraminxScramble(){
    const faces = ['U','L','R','B'];
    const mods = [&quot;&quot;, &quot;'&quot;];
    const tips = ['u','l','r','b'];
    let lastFace = null;
    const moves = [];
    const len = 8 + randInt(4);
    for(let i=0;i&lt;len;i++){
      let face;
      do{ face = pick(faces); } while(face===lastFace);
      lastFace = face;
      moves.push(face + pick(mods));
    }
    const usedTips = new Set();
    const tipCount = randInt(3);
    for(let i=0;i&lt;tipCount;i++){
      const t = pick(tips);
      if(!usedTips.has(t)){
        usedTips.add(t);
        moves.push(t + pick(mods));
      }
    }
    return moves.join(' ');
  }

  function skewbScramble(){
    const faces = ['U','L','R','B'];
    const mods = [&quot;&quot;, &quot;'&quot;];
    let lastFace = null;
    const moves = [];
    const len = 8 + randInt(4);
    for(let i=0;i&lt;len;i++){
      let face;
      do{ face = pick(faces); } while(face===lastFace);
      lastFace = face;
      moves.push(face + pick(mods));
    }
    return moves.join(' ');
  }

  function megaminxScramble(){
    const rSigns = ['++','--'];
    const moves = [];
    for(let i=0;i&lt;7;i++){
      moves.push('R'+pick(rSigns), 'D'+pick(rSigns));
    }
    moves.push(Math.random()&lt;0.5 ? 'U' : &quot;U'&quot;);
    return moves.join(' ');
  }

  function squareOneScramble(){
    const parts = [];
    for(let i=0;i&lt;10;i++){
      const top = randInt(11) - 5;
      const bottom = randInt(11) - 5;
      parts.push('(' + top + ',' + bottom + ')');
    }
    return parts.join(' / ');
  }

  function generateScramble(puzzle){
    const fruOnly = !!store.settings.fru;
    switch(puzzle){
      case '2x2x2': return nxnScramble(2, 9 + randInt(3), fruOnly);
      case '3x3x3': return nxnScramble(3, 20, fruOnly);
      case '4x4x4': return nxnScramble(4, 40, fruOnly);
      case '5x5x5': return nxnScramble(5, 60, fruOnly);
      case '6x6x6': return nxnScramble(6, 80, fruOnly);
      case '7x7x7': return nxnScramble(7, 100, fruOnly);
      case 'Pyraminx': return pyraminxScramble();
      case 'Skewb': return skewbScramble();
      case 'Megaminx': return megaminxScramble();
      case 'Square-1': return squareOneScramble();
      default: return nxnScramble(3, 20);
    }
  }

  // ================= Cube engine (validated against a reference solver) =================
  // Sticker-array model. Faces U/R/F/D/L/B, each n*n array of face-letters.
  const CubeEngine = (function(){
    function newSolved(n){
      return { U:Array(n*n).fill('U'), R:Array(n*n).fill('R'), F:Array(n*n).fill('F'),
               D:Array(n*n).fill('D'), L:Array(n*n).fill('L'), B:Array(n*n).fill('B') };
    }
    function rotateFaceCW(arr, n){
      const res = new Array(n*n);
      for(let r=0;r&lt;n;r++) for(let c=0;c&lt;n;c++) res[r*n+c] = arr[(n-1-c)*n + r];
      return res;
    }
    function rotateFaceCCW(arr,n){
      const res = new Array(n*n);
      for(let r=0;r&lt;n;r++) for(let c=0;c&lt;n;c++) res[r*n+c] = arr[c*n + (n-1-r)];
      return res;
    }
    function getRow(face, r, n){ return face.slice(r*n, r*n+n); }
    function setRow(face, r, n, vals){ for(let i=0;i&lt;n;i++) face[r*n+i] = vals[i]; }
    function getCol(face, c, n){ const out=[]; for(let r=0;r&lt;n;r++) out.push(face[r*n+c]); return out; }
    function setCol(face, c, n, vals){ for(let r=0;r&lt;n;r++) face[r*n+c] = vals[r]; }
    function rev(arr){ return arr.slice().reverse(); }

    function applySingle(state, face, n, cw){
      if(face === 'U'){
        state.U = cw ? rotateFaceCW(state.U,n) : rotateFaceCCW(state.U,n);
        const f=getRow(state.F,0,n), r=getRow(state.R,0,n), b=getRow(state.B,0,n), l=getRow(state.L,0,n);
        if(cw){ setRow(state.F,0,n,r); setRow(state.L,0,n,f); setRow(state.B,0,n,l); setRow(state.R,0,n,b); }
        else { setRow(state.F,0,n,l); setRow(state.R,0,n,f); setRow(state.B,0,n,r); setRow(state.L,0,n,b); }
      } else if(face === 'D'){
        state.D = cw ? rotateFaceCW(state.D,n) : rotateFaceCCW(state.D,n);
        const f=getRow(state.F,n-1,n), r=getRow(state.R,n-1,n), b=getRow(state.B,n-1,n), l=getRow(state.L,n-1,n);
        if(cw){ setRow(state.F,n-1,n,l); setRow(state.R,n-1,n,f); setRow(state.B,n-1,n,r); setRow(state.L,n-1,n,b); }
        else { setRow(state.F,n-1,n,r); setRow(state.L,n-1,n,f); setRow(state.B,n-1,n,l); setRow(state.R,n-1,n,b); }
      } else if(face === 'R'){
        state.R = cw ? rotateFaceCW(state.R,n) : rotateFaceCCW(state.R,n);
        const u=getCol(state.U,n-1,n), f=getCol(state.F,n-1,n), d=getCol(state.D,n-1,n), b=getCol(state.B,0,n);
        if(cw){ setCol(state.U,n-1,n,f); setCol(state.F,n-1,n,d); setCol(state.D,n-1,n,rev(b)); setCol(state.B,0,n,rev(u)); }
        else { setCol(state.U,n-1,n,rev(b)); setCol(state.B,0,n,rev(d)); setCol(state.D,n-1,n,f); setCol(state.F,n-1,n,u); }
      } else if(face === 'L'){
        state.L = cw ? rotateFaceCW(state.L,n) : rotateFaceCCW(state.L,n);
        const u=getCol(state.U,0,n), f=getCol(state.F,0,n), d=getCol(state.D,0,n), b=getCol(state.B,n-1,n);
        if(cw){ setCol(state.U,0,n,rev(b)); setCol(state.B,n-1,n,rev(d)); setCol(state.D,0,n,f); setCol(state.F,0,n,u); }
        else { setCol(state.U,0,n,f); setCol(state.F,0,n,d); setCol(state.D,0,n,rev(b)); setCol(state.B,n-1,n,rev(u)); }
      } else if(face === 'F'){
        state.F = cw ? rotateFaceCW(state.F,n) : rotateFaceCCW(state.F,n);
        const u=getRow(state.U,n-1,n), r=getCol(state.R,0,n), d=getRow(state.D,0,n), l=getCol(state.L,n-1,n);
        if(cw){ setCol(state.R,0,n,u); setRow(state.D,0,n,rev(r)); setCol(state.L,n-1,n,d); setRow(state.U,n-1,n,rev(l)); }
        else { setRow(state.U,n-1,n,r); setCol(state.R,0,n,rev(d)); setRow(state.D,0,n,l); setCol(state.L,n-1,n,rev(u)); }
      } else if(face === 'B'){
        state.B = cw ? rotateFaceCW(state.B,n) : rotateFaceCCW(state.B,n);
        const u=getRow(state.U,0,n), r=getCol(state.R,n-1,n), d=getRow(state.D,n-1,n), l=getCol(state.L,0,n);
        if(cw){ setRow(state.U,0,n,r); setCol(state.R,n-1,n,rev(d)); setRow(state.D,n-1,n,l); setCol(state.L,0,n,rev(u)); }
        else { setCol(state.R,n-1,n,u); setRow(state.D,n-1,n,rev(r)); setCol(state.L,0,n,d); setRow(state.U,0,n,rev(l)); }
      }
    }
    function turnFace(state, face, n, dir){
      const times = dir === 2 ? 2 : 1;
      const cw = dir !== -1;
      for(let t=0;t&lt;times;t++) applySingle(state, face, n, cw);
    }
    function applyMoveToken(state, n, token){
      const m = token.match(/^(\d*)([UDLRFB])(w?)('?)(2?)$/);
      if(!m) return;
      const face = m[2];
      const prime = m[4] === &quot;'&quot;;
      const double = m[5] === '2';
      const dir = double ? 2 : (prime ? -1 : 1);
      turnFace(state, face, n, dir);
    }
    function applyScramble(n, scramble){
      const state = newSolved(n);
      scramble.split(/\s+/).filter(Boolean).forEach(tok=&gt;applyMoveToken(state,n,tok));
      return state;
    }
    return { newSolved, applyScramble };
  })();

  const STICKER_COLOR = {
    U: 'var(--sticker-white)', D: 'var(--sticker-yellow)',
    F: 'var(--sticker-green)', B: 'var(--sticker-blue)',
    L: 'var(--sticker-orange)', R: 'var(--sticker-red)'
  };

  function renderVisualizer(){
    const el = document.getElementById('visualizer');
    const n = currentPuzzle === '2x2x2' ? 2 : (currentPuzzle === '3x3x3' ? 3 : null);
    if(!n || !pendingScramble){
      el.innerHTML = '&lt;div class=&quot;vnote&quot;&gt;Visual preview available for 2x2 &amp;amp; 3x3&lt;/div&gt;';
      return;
    }
    const state = CubeEngine.applyScramble(n, pendingScramble);
    const cell = 16, gap = 2;
    const faceW = n*cell + (n-1)*gap;
    const pad = 6;
    // net layout columns: [gap, L, F, R, B] rows: [U row, mid row, D row]
    const totalW = faceW*4 + pad*5;
    const totalH = faceW*3 + pad*4;
    function faceSvg(face, ox, oy){
      let s = '';
      for(let r=0;r&lt;n;r++){
        for(let c=0;c&lt;n;c++){
          const x = ox + c*(cell+gap);
          const y = oy + r*(cell+gap);
          const color = STICKER_COLOR[state[face][r*n+c]];
          s += `&lt;rect x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;${cell}&quot; height=&quot;${cell}&quot; rx=&quot;2&quot; fill=&quot;${color}&quot; stroke=&quot;#14161b&quot; stroke-width=&quot;1.5&quot;/&gt;`;
        }
      }
      return s;
    }
    let svg = '';
    // U face sits above F (col index 1)
    svg += faceSvg('U', pad + faceW + pad*1, pad);
    // row 2: L F R B
    const rowY = pad + faceW + pad;
    svg += faceSvg('L', pad, rowY);
    svg += faceSvg('F', pad + faceW + pad, rowY);
    svg += faceSvg('R', pad + (faceW+pad)*2, rowY);
    svg += faceSvg('B', pad + (faceW+pad)*3, rowY);
    // D below F
    svg += faceSvg('D', pad + faceW + pad, rowY + faceW + pad);

    el.innerHTML = `&lt;svg id=&quot;vizSvg&quot; viewBox=&quot;0 0 ${totalW} ${totalH}&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;${svg}&lt;/svg&gt;`;
  }

  // ================= Formatting =================
  function fmt(ms){
    if(ms == null) return 'DNF';
    const totalCs = Math.round(ms/10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs/100);
    const sec = totalSec % 60;
    const min = Math.floor(totalSec/60);
    const csStr = String(cs).padStart(2,'0');
    if(min &gt; 0) return min + ':' + String(sec).padStart(2,'0') + '.' + csStr;
    return sec + '.' + csStr;
  }

  function displayForEntry(e){
    if(e.penalty === 'dnf') return 'DNF';
    const t = e.penalty === 'plus2' ? e.time + 2000 : e.time;
    return fmt(t) + (e.penalty === 'plus2' ? '+' : '');
  }
  function effectiveMs(e){
    if(e.penalty === 'dnf') return null;
    return e.penalty === 'plus2' ? e.time + 2000 : e.time;
  }

  // ================= Stats =================
  function average(list, minSize){
    minSize = minSize || 5;
    const vals = list.map(effectiveMs);
    if(list.length &lt; minSize) return null;
    const dnfCount = vals.filter(v=&gt;v===null).length;
    if(dnfCount &gt; 1) return null;
    const sorted = vals.slice().sort((a,b)=&gt; (a===null?Infinity:a) - (b===null?Infinity:b));
    const trimmed = sorted.slice(1, sorted.length-1);
    if(trimmed.some(v=&gt;v===null)) return null;
    const sum = trimmed.reduce((a,b)=&gt;a+b,0);
    return sum/trimmed.length;
  }

  function dateKey(d){
    return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  }
  function computeTodayAndStreak(p){
    const entries = allEntriesFor(p);
    const days = new Set();
    let todayCount = 0;
    const todayKey = dateKey(new Date());
    entries.forEach(e=&gt;{
      if(!e.date) return;
      const d = new Date(e.date);
      days.add(dateKey(d));
      if(dateKey(d) === todayKey) todayCount++;
    });
    let streak = 0;
    let d = new Date();
    if(!days.has(dateKey(d))) d.setDate(d.getDate()-1);
    while(days.has(dateKey(d))){
      streak++;
      d.setDate(d.getDate()-1);
    }
    return { todayCount, streak };
  }

  function mean3(list){
    const last3 = list.slice(-3);
    if(last3.length &lt; 3) return null;
    const vals = last3.map(effectiveMs);
    if(vals.some(v=&gt;v===null)) return null;
    return vals.reduce((a,b)=&gt;a+b,0)/3;
  }

  function renderStats(){
    const list = sessionFor(currentPuzzle);
    const valid = list.map(effectiveMs).filter(v=&gt;v!==null);
    const best = valid.length ? Math.min(...valid) : null;
    const worst = valid.length ? Math.max(...valid) : null;
    const mean = valid.length ? valid.reduce((a,b)=&gt;a+b,0)/valid.length : null;
    const last5 = list.slice(-5);
    const last12 = list.slice(-12);
    const ao5 = average(last5, 5);
    const ao12 = average(last12, 12);
    const mo3 = mean3(list);
    const pb = store.pbs[currentPuzzle] || {};
    const { todayCount, streak } = computeTodayAndStreak(currentPuzzle);

    const allEntries = allEntriesFor(currentPuzzle);
    const todayKey = dateKey(new Date());
    const todayVals = allEntries.filter(e=&gt;e.date &amp;&amp; dateKey(new Date(e.date))===todayKey).map(effectiveMs).filter(v=&gt;v!==null);
    const todayBest = todayVals.length ? Math.min(...todayVals) : null;
    const totalSolves = allEntries.length;
    const totalMs = allEntries.reduce((sum,e)=&gt; sum + (e.time||0), 0);
    const totalTimeStr = (()=&gt;{
      const totalSec = Math.round(totalMs/1000);
      const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60);
      if(h &gt; 0) return h+'h '+m+'m';
      return m+'m';
    })();

    const prevAo5 = average(list.slice(0, -1).slice(-5), 5);
    let ao5Trend = null;
    if(ao5 != null &amp;&amp; prevAo5 != null &amp;&amp; ao5 !== prevAo5){
      const delta = ao5 - prevAo5;
      ao5Trend = delta &lt; 0
        ? `&lt;span style=&quot;color:var(--accent);&quot;&gt;↓ ${fmt(Math.abs(delta))}&lt;/span&gt;`
        : `&lt;span style=&quot;color:var(--red);&quot;&gt;↑ ${fmt(delta)}&lt;/span&gt;`;
    }

    const stats = [
      { label:'Best', val: best!==null ? fmt(best) : '—' },
      { label:'Worst', val: worst!==null ? fmt(worst) : '—' },
      { label:'Mean', val: mean!==null ? fmt(mean) : '—' },
      { label:'Mo3', val: mo3!==null ? fmt(mo3) : '—' },
      { label:'Ao5', val: ao5!==null ? fmt(ao5) : '—', sub: pb.ao5!=null ? 'PB '+fmt(pb.ao5) : null, trend: ao5Trend },
      { label:'Ao12', val: ao12!==null ? fmt(ao12) : '—', sub: pb.ao12!=null ? 'PB '+fmt(pb.ao12) : null },
      { label:'Today', val: String(todayCount), sub: streak&gt;0 ? streak+'d streak' : null },
      { label:&quot;Today's Best&quot;, val: todayBest!==null ? fmt(todayBest) : '—' },
      { label:'Total Solves', val: String(totalSolves) },
      { label:'Time Cubing', val: totalMs&gt;0 ? totalTimeStr : '—' },
    ];
    if(list.length &gt;= 50){
      stats.push({ label:'Ao50', val: fmt(average(list.slice(-50), 50)) });
    }
    if(list.length &gt;= 100){
      stats.push({ label:'Ao100', val: fmt(average(list.slice(-100), 100)) });
    }
    const customN = parseInt(store.settings.customAoN, 10);
    if(customN &gt; 0 &amp;&amp; list.length &gt;= customN){
      stats.push({ label:'Ao'+customN, val: fmt(average(list.slice(-customN), customN)) });
    }
    const el = document.getElementById('stats');
    el.innerHTML = stats.map(s=&gt;`&lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;stat-label&quot;&gt;${s.label}&lt;/div&gt;&lt;div class=&quot;stat-value&quot;&gt;${s.val}&lt;/div&gt;${s.trend?`&lt;div class=&quot;stat-sub&quot;&gt;${s.trend}&lt;/div&gt;`:(s.sub?`&lt;div class=&quot;stat-sub&quot;&gt;${s.sub}&lt;/div&gt;`:'')}&lt;/div&gt;`).join('');

    const goalEl = document.getElementById('dailyGoalBar');
    if(goalEl){
      const goal = store.settings.dailyGoal;
      if(goal){
        const pct = Math.min(100, Math.round((todayCount/goal)*100));
        goalEl.style.display = 'flex';
        goalEl.innerHTML = `&lt;span&gt;${todayCount}/${goal} today&lt;/span&gt;&lt;div class=&quot;bar&quot;&gt;&lt;div class=&quot;bar-fill&quot; style=&quot;width:${pct}%;&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
      } else {
        goalEl.style.display = 'none';
      }
    }
  }

  function renderTimesList(){
    const list = sessionFor(currentPuzzle);
    const el = document.getElementById('timesList');
    if(!list.length){
      el.innerHTML = '&lt;div class=&quot;empty-note&quot;&gt;No solves yet. Hold space to begin.&lt;/div&gt;';
      return;
    }
    const validVals = list.map(effectiveMs).filter(v=&gt;v!==null);
    const bestVal = validVals.length ? Math.min(...validVals) : null;
    const worstVal = validVals.length ? Math.max(...validVals) : null;
    const todayKey = dateKey(new Date());
    let todayBestVal = null, todayBestIdx = -1;
    list.forEach((e,i)=&gt;{
      if(e.date &amp;&amp; dateKey(new Date(e.date)) === todayKey){
        const v = effectiveMs(e);
        if(v !== null &amp;&amp; (todayBestVal === null || v &lt; todayBestVal)){ todayBestVal = v; todayBestIdx = i; }
      }
    });
    let html = '';
    for(let i=list.length-1;i&gt;=0;i--){
      const e = list[i];
      const v = effectiveMs(e);
      let cls = e.penalty === 'dnf' ? 'dnf' : (e.penalty === 'plus2' ? 'plus2' : '');
      if(v !== null &amp;&amp; bestVal !== null &amp;&amp; v === bestVal) cls += ' row-best';
      else if(v !== null &amp;&amp; worstVal !== null &amp;&amp; v === worstVal &amp;&amp; validVals.length &gt; 1) cls += ' row-worst';
      const todayBadge = (i === todayBestIdx &amp;&amp; !e.pbSingle) ? '&lt;span class=&quot;today-best-tag&quot;&gt;Today&lt;/span&gt;' : '';
      html += `&lt;div class=&quot;time-row ${cls}&quot; data-idx=&quot;${i}&quot;&gt;
        &lt;span class=&quot;idx&quot;&gt;${i+1}.&lt;/span&gt;
        &lt;span class=&quot;val&quot; data-copy=&quot;${i}&quot; title=&quot;Click to copy · double-click to edit&quot;&gt;${displayForEntry(e)}${e.pbSingle ? '&lt;span class=&quot;pb-tag&quot;&gt;PB&lt;/span&gt;' : ''}${todayBadge}&lt;/span&gt;
        &lt;span class=&quot;del&quot; data-del=&quot;${i}&quot; title=&quot;Delete&quot;&gt;✕&lt;/span&gt;
      &lt;/div&gt;`;
    }
    el.innerHTML = html;
    el.querySelectorAll('[data-del]').forEach(btn=&gt;{
      btn.addEventListener('click', (ev)=&gt;{
        ev.stopPropagation();
        const idx = parseInt(btn.getAttribute('data-del'),10);
        const removed = list[idx];
        list.splice(idx,1);
        saveStore();
        renderAll();
        showUndoToast(removed, idx, 'Solve deleted');
      });
    });
    el.querySelectorAll('[data-copy]').forEach(span=&gt;{
      span.addEventListener('click', ()=&gt;{
        const idx = parseInt(span.getAttribute('data-copy'),10);
        const text = displayForEntry(list[idx]);
        if(navigator.clipboard &amp;&amp; navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).catch(()=&gt;{});
        }
        span.style.transition = 'color .15s';
        const orig = span.style.color;
        span.style.color = 'var(--accent)';
        setTimeout(()=&gt;{ span.style.color = orig; }, 300);
      });
      span.addEventListener('dblclick', (ev)=&gt;{
        ev.stopPropagation();
        const idx = parseInt(span.getAttribute('data-copy'),10);
        const entry = list[idx];
        const input = prompt('Edit time (seconds):', (entry.time/1000).toFixed(2));
        if(input === null) return;
        const val = parseFloat(input);
        if(isNaN(val) || val &lt;= 0) return;
        entry.time = Math.round(val*1000);
        saveStore();
        renderAll();
      });
    });
  }

  function renderGraph(){
    const list = sessionFor(currentPuzzle);
    if(graphMode === 'hist') renderHistogram(list);
    else renderTrend(list);
  }

  function renderTrend(list){
    const svg = document.getElementById('graph');
    const w = 400, h = 180, pad = 14;
    if(list.length &lt; 2){
      svg.innerHTML = `&lt;text x=&quot;${w/2}&quot; y=&quot;${h/2}&quot; fill=&quot;#4d525f&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; font-family=&quot;Manrope, sans-serif&quot;&gt;Not enough solves yet&lt;/text&gt;`;
      return;
    }
    const vals = list.map(effectiveMs);
    const finiteVals = vals.filter(v=&gt;v!==null);
    if(!finiteVals.length){
      svg.innerHTML = `&lt;text x=&quot;${w/2}&quot; y=&quot;${h/2}&quot; fill=&quot;#4d525f&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; font-family=&quot;Manrope, sans-serif&quot;&gt;All DNF&lt;/text&gt;`;
      return;
    }
    const min = Math.min(...finiteVals), max = Math.max(...finiteVals);
    const range = (max - min) || 1;
    const stepX = (w - pad*2) / (vals.length - 1);
    let points = [];
    let lastY = h/2;
    vals.forEach((v,i)=&gt;{
      const x = pad + i*stepX;
      const y = v===null ? lastY : (h - pad) - ((v-min)/range)*(h - pad*2);
      if(v!==null) lastY = y;
      points.push([x,y,v===null]);
    });
    let path = 'M ' + points.map(p=&gt;p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
    let dots = points.map(p=&gt;`&lt;circle cx=&quot;${p[0].toFixed(1)}&quot; cy=&quot;${p[1].toFixed(1)}&quot; r=&quot;3&quot; fill=&quot;${p[2] ? '#d9463c' : 'var(--accent)'}&quot; /&gt;`).join('');
    svg.innerHTML = `&lt;path d=&quot;${path}&quot; fill=&quot;none&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2&quot; stroke-opacity=&quot;0.8&quot; /&gt;${dots}`;
  }

  function renderHistogram(list){
    const svg = document.getElementById('graph');
    const w = 400, h = 180, pad = 20;
    const vals = list.map(effectiveMs).filter(v=&gt;v!==null);
    if(vals.length &lt; 3){
      svg.innerHTML = `&lt;text x=&quot;${w/2}&quot; y=&quot;${h/2}&quot; fill=&quot;#4d525f&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; font-family=&quot;Manrope, sans-serif&quot;&gt;Not enough solves yet&lt;/text&gt;`;
      return;
    }
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max - min) || 1;
    const bucketCount = Math.min(10, Math.max(5, Math.round(Math.sqrt(vals.length))));
    const buckets = new Array(bucketCount).fill(0);
    vals.forEach(v=&gt;{
      let idx = Math.floor(((v-min)/range) * bucketCount);
      if(idx &gt;= bucketCount) idx = bucketCount-1;
      buckets[idx]++;
    });
    const maxCount = Math.max(...buckets);
    const barW = (w - pad*2) / bucketCount;
    let bars = '';
    buckets.forEach((count,i)=&gt;{
      const barH = (count/maxCount) * (h - pad*2 - 14);
      const x = pad + i*barW;
      const y = h - pad - barH;
      bars += `&lt;rect x=&quot;${(x+1.5).toFixed(1)}&quot; y=&quot;${y.toFixed(1)}&quot; width=&quot;${(barW-3).toFixed(1)}&quot; height=&quot;${barH.toFixed(1)}&quot; rx=&quot;2&quot; fill=&quot;var(--accent)&quot; fill-opacity=&quot;0.75&quot; /&gt;`;
      if(count &gt; 0){
        bars += `&lt;text x=&quot;${(x+barW/2).toFixed(1)}&quot; y=&quot;${(y-4).toFixed(1)}&quot; fill=&quot;#868c99&quot; font-size=&quot;9&quot; text-anchor=&quot;middle&quot; font-family=&quot;JetBrains Mono, monospace&quot;&gt;${count}&lt;/text&gt;`;
      }
    });
    bars += `&lt;text x=&quot;${pad}&quot; y=&quot;${h-4}&quot; fill=&quot;#4d525f&quot; font-size=&quot;10&quot; text-anchor=&quot;start&quot; font-family=&quot;JetBrains Mono, monospace&quot;&gt;${fmt(min)}&lt;/text&gt;`;
    bars += `&lt;text x=&quot;${w-pad}&quot; y=&quot;${h-4}&quot; fill=&quot;#4d525f&quot; font-size=&quot;10&quot; text-anchor=&quot;end&quot; font-family=&quot;JetBrains Mono, monospace&quot;&gt;${fmt(max)}&lt;/text&gt;`;
    svg.innerHTML = bars;
  }

  const HOLD_MS = 300;
  let audioCtx = null;
  function playTone(freq, durationMs){
    if(!store.settings.sound) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durationMs/1000);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durationMs/1000);
    }catch(e){}
  }
  let state = 'idle';
  let spaceDown = false;
  let holdTimer = null;
  let inspectStart = null;
  let inspectInterval = null;
  let runStart = null;
  let rafId = null;
  let pendingScramble = null;
  let lastResultIndex = null;

  function setState(s){
    state = s;
    stage.className = 'stage state-' + s;
  }

  function newScramble(){
    pendingScramble = generateScramble(currentPuzzle);
    scrambleText.textContent = pendingScramble;

  function beginHold(){
    if(state === 'running' || state === 'holding' || state === 'ready') return;
    if(state === 'stopped'){
      hidePenaltyRow();
    }
    const inspectOn = parseInt(store.settings.inspect,10) &gt; 0;

    if(inspectOn){
      if(state !== 'inspecting'){
        stage.dataset.inspectionPenalty = '';
        setState('inspecting');
        startInspection();
        return;
      }
      if(state === 'inspecting'){
        setState('holding');
        clearTimeout(holdTimer);
        holdTimer = setTimeout(()=&gt;{
          if(spaceDown &amp;&amp; state === 'holding'){
            setState('ready');
          }
        }, HOLD_MS);
        return;
      }
      return;
    }

    stage.dataset.inspectionPenalty = '';
    setState('holding');
    subLabel.textContent = 'hold...';
    clearTimeout(holdTimer);
    holdTimer = setTimeout(()=&gt;{
      if(spaceDown){
        setState('ready');
        subLabel.textContent = 'release to start';
      }
    }, HOLD_MS);
  }

  function startInspection(){
    inspectStart = performance.now();
    subLabel.textContent = 'inspecting...';
    clearInterval(inspectInterval);
    inspectInterval = setInterval(()=&gt;{
      const limit = parseInt(store.settings.inspect,10);
      const elapsed = (performance.now() - inspectStart)/1000;
      const remaining = Math.max(0, limit - elapsed);
      if(state === 'inspecting'){
        subLabel.textContent = 'inspecting · ' + Math.ceil(remaining) + 's — hold to start';
      } else if(state === 'holding'){
        subLabel.textContent = 'hold... · ' + Math.ceil(remaining) + 's left';
      } else if(state === 'ready'){
        subLabel.textContent = 'release to start · ' + Math.ceil(remaining) + 's left';
      }
      if(elapsed &gt;= limit &amp;&amp; state !== 'running'){
        clearInterval(inspectInterval);
        clearTimeout(holdTimer);
        stage.dataset.inspectionPenalty = 'plus2';
        startRun();
      }
    }, 100);
  }

  function cancelHold(){
    clearTimeout(holdTimer);
    if(inspectStart !== null){
      setState('inspecting');
      subLabel.textContent = '';
    } else if(state !== 'stopped'){
      clearInterval(inspectInterval);
      setState('idle');
      subLabel.textContent = '';
    }
  }

  function startRun(){
    if(state === 'running') return;
    clearInterval(inspectInterval);
    inspectStart = null;
    setState('running');
    subLabel.textContent = '';
    pbBanner.textContent = '';
    runStart = performance.now();
    playTone(880, 90);
    buzz();
    tick();
  }

  function tick(){
    const elapsed = performance.now() - runStart;
    if(store.settings.hideTime){
      readout.textContent = '•';
      readout.classList.add('dim');
    } else {
      readout.textContent = fmt(elapsed);
      readout.classList.remove('dim');
    }
    rafId = requestAnimationFrame(tick);
  }

  function checkAndApplyPBs(entry, list){
    const p = currentPuzzle;
    if(!store.pbs[p]) store.pbs[p] = {};
    const pb = store.pbs[p];
    let celebrate = false;
    const single = effectiveMs(entry);
    if(single !== null &amp;&amp; (pb.single == null || single &lt; pb.single)){
      pb.single = single;
      entry.pbSingle = true;
      celebrate = true;
    }
    const ao5 = average(list.slice(-5), 5);
    if(ao5 !== null &amp;&amp; (pb.ao5 == null || ao5 &lt; pb.ao5)){
      const hadPrevious = pb.ao5 != null;
      pb.ao5 = ao5;
      if(hadPrevious) celebrate = true;
    }
    const ao12 = average(list.slice(-12), 12);
    if(ao12 !== null &amp;&amp; (pb.ao12 == null || ao12 &lt; pb.ao12)){
      const hadPrevious = pb.ao12 != null;
      pb.ao12 = ao12;
      if(hadPrevious) celebrate = true;
    }
    return celebrate;
  }

  function stopRun(){
    cancelAnimationFrame(rafId);
    const elapsed = performance.now() - runStart;
    readout.classList.remove('dim');
    readout.textContent = fmt(elapsed);
    setState('stopped');
    playTone(440, 130);
    buzz();
    const insp = stage.dataset.inspectionPenalty || null;
    stage.dataset.inspectionPenalty = '';

    if(store.settings.practice){
      subLabel.textContent = 'practice — not saved';
      hidePenaltyRow();
      lastResultIndex = null;
      newScramble();
      return;
    }

    const entry = {
      time: Math.round(elapsed),
      scramble: pendingScramble,
      penalty: insp === 'plus2' ? 'plus2' : null,
      date: Date.now()
    };
    const list = sessionFor(currentPuzzle);
    list.push(entry);
    lastResultIndex = list.length - 1;
    const gotPb = checkAndApplyPBs(entry, list);
    saveStore();
    renderAll();
    showPenaltyRow(entry);
    if(gotPb){
      pbBanner.textContent = '★ Personal Best';
      stage.classList.remove('pb-flash');
      void stage.offsetWidth;
      stage.classList.add('pb-flash');
    } else if(store.settings.goalTime &amp;&amp; effectiveMs(entry) !== null &amp;&amp; effectiveMs(entry) &lt;= store.settings.goalTime*1000){
      pbBanner.textContent = '✓ Goal beaten';
      stage.classList.remove('pb-flash');
      void stage.offsetWidth;
      stage.classList.add('pb-flash');
    }
    const totalSolvesNow = allEntriesFor(currentPuzzle).length;
    if([50,100,250,500,1000,2500,5000,10000].includes(totalSolvesNow)){
      showUndoToast(null, -1, '🎉 ' + totalSolvesNow + ' solves on ' + currentPuzzle + '!');
    }
    newScramble();
  }

  function showPenaltyRow(entry){

    if(entry.penalty === 'plus2') penaltyRow.querySelector('[data-p=&quot;plus2&quot;]').classList.add('active');

    const toast = document.getElementById('undoToast');

    text.textContent = message;

    btn.onclick = ()=&gt;{
      if(entry === null) return;
      const list = sessionFor(currentPuzzle);
      list.splice(Math.min(index, list.length), 0, entry);

  penaltyRow.addEventListener('click', (ev)=&gt;{

  // ================= Input handling =================
  function keyIsSpace(e){ return e.code === 'Space' || e.key === ' '; }
  function isTypingTarget(){
    return document.activeElement &amp;&amp; ['SELECT','INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  }

  window.addEventListener('keydown', (e)=&gt;{
    if(keyIsSpace(e)){
      if(isTypingTarget()) return;
      e.preventDefault();
      if(e.repeat) return;
      spaceDown = true;
      if(state === 'running'){ stopRun(); return; }
      beginHold();
      return;
    }
    if(isTypingTarget()) return;
    if(e.key === '?'){
      toggleHelp();
      return;
    }
    if(state === 'running' || state === 'holding' || state === 'ready' || state === 'inspecting') return;
    if(e.key &gt;= '1' &amp;&amp; e.key &lt;= '9'){
      const idx = parseInt(e.key, 10) - 1;
      if(idx &lt; PUZZLES.length){
        puzzleSelect.value = PUZZLES[idx];
        puzzleSelect.dispatchEvent(new Event('change'));
      }
      return;
    }
    if(e.key === 'n' || e.key === 'N'){
      newScramble();
      return;
    }
    if(e.key === 's' || e.key === 'S'){
      newSession(currentPuzzle);
      renderAll();
      return;
    }
    const list = sessionFor(currentPuzzle);
    if(!list.length) return;
    const lastIdx = list.length - 1;
    if(e.key === 'Backspace' || e.key === 'Delete'){
      e.preventDefault();
      const removed = list[lastIdx];
      list.splice(lastIdx,1);
      if(lastResultIndex === lastIdx){ lastResultIndex = null; hidePenaltyRow(); }
      saveStore(); renderAll();
      showUndoToast(removed, lastIdx, 'Solve deleted');
    } else if(e.key === 'z' || e.key === 'Z'){
      list[lastIdx].penalty = list[lastIdx].penalty === 'plus2' ? null : 'plus2';
      saveStore(); renderAll();
    } else if(e.key === 'x' || e.key === 'X'){
      list[lastIdx].penalty = list[lastIdx].penalty === 'dnf' ? null : 'dnf';
      saveStore(); renderAll();
    }
  });

    const rows = list.map((e,i)=&gt; `&lt;tr&gt;&lt;td&gt;${i+1}&lt;/td&gt;&lt;td&gt;${displayForEntry(e)}&lt;/td&gt;&lt;/tr&gt;`).join('');
    const w = window.open('', '_blank');
    if(!w) return;
    w.document.write(`&lt;html&gt;&lt;head&gt;&lt;title&gt;${currentPuzzle} times&lt;/title&gt;&lt;/head&gt;&lt;body&gt;
      &lt;h2&gt;${currentPuzzle} — ${list.length} solves&lt;/h2&gt;
      &lt;table border=&quot;1&quot; cellpadding=&quot;6&quot; style=&quot;border-collapse:collapse;&quot;&gt;${rows}&lt;/table&gt;
    &lt;/body&gt;&lt;/html&gt;`);
    w.document.close();
    w.print();
  });

  document.getElementById('sessionSelect').addEventListener('change', (e)=&gt;{
    store.activeSession[currentPuzzle] = e.target.value;
    saveStore();
    renderAll();
  });

  document.getElementById('exportCsv').addEventListener('click', ()=&gt;{
    const list = sessionFor(currentPuzzle);
    if(!list.length) return;
    let csv = 'index,time,penalty,scramble,date\n';
    list.forEach((e,i)=&gt;{
      const t = e.penalty === 'dnf' ? 'DNF' : (fmt(e.time) + (e.penalty === 'plus2' ? ' (+2)' : ''));
      const row = [i+1, t, e.penalty || '', '&quot;'+(e.scramble||'').replace(/&quot;/g,'&quot;&quot;')+'&quot;', new Date(e.date).toISOString()];
      csv += row.join(',') + '\n';
    });
    downloadFile(csv, currentPuzzle + '-session.csv', 'text/csv');
  });

  function downloadFile(content, filename, mime){
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ================= Settings drawer =================
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('backdrop');
  document.getElementById('openSettings').addEventListener('click', ()=&gt;{
    drawer.classList.add('show');
    backdrop.classList.add('show');
  });
  backdrop.addEventListener('click', ()=&gt;{
    drawer.classList.remove('show');
    backdrop.classList.remove('show');
  });

  document.getElementById('zenToggle').addEventListener('click', ()=&gt;{
    document.querySelector('.app').classList.toggle('zen');
  });

  const helpPanel = document.getElementById('helpPanel');
  const helpBackdrop = document.getElementById('helpBackdrop');
  function toggleHelp(){
    const showing = helpPanel.classList.contains('show');
    helpPanel.classList.toggle('show', !showing);
    helpBackdrop.classList.toggle('show', !showing);
  }
  document.getElementById('helpToggle').addEventListener('click', toggleHelp);
  helpBackdrop.addEventListener('click', toggleHelp);

  const inspectSelect = document.getElementById('inspectMode');
  inspectSelect.value = String(store.settings.inspect || 0);
  inspectSelect.addEventListener('change', ()=&gt;{
    store.settings.inspect = parseInt(inspectSelect.value,10);
    saveStore();
  });

  function wireSwitch(el, key){
    function render(){ el.classList.toggle('on', !!store.settings[key]); }
    render();
    el.addEventListener('click', ()=&gt;{
      store.settings[key] = !store.settings[key];
      saveStore();
      render();
    });
  }
  wireSwitch(document.getElementById('hideTimeSwitch'), 'hideTime');
  wireSwitch(document.getElementById('soundSwitch'), 'sound');
  wireSwitch(document.getElementById('fruSwitch'), 'fru');
  document.getElementById('fruSwitch').addEventListener('click', ()=&gt;{
    newScramble();
  });
  wireSwitch(document.getElementById('practiceSwitch'), 'practice');

  const themeSwitch = document.getElementById('themeSwitch');
  function applyTheme(){
    document.documentElement.classList.toggle('light', !!store.settings.lightTheme);
    themeSwitch.classList.toggle('on', !!store.settings.lightTheme);
  }
  applyTheme();
  themeSwitch.addEventListener('click', ()=&gt;{
    store.settings.lightTheme = !store.settings.lightTheme;
    saveStore();
    applyTheme();
  });

  wireSwitch(document.getElementById('vibrateSwitch'), 'vibrate');

  const dailyGoalInput = document.getElementById('dailyGoalInput');
  dailyGoalInput.value = store.settings.dailyGoal || '';
  dailyGoalInput.addEventListener('change', ()=&gt;{
    const v = parseInt(dailyGoalInput.value, 10);
    store.settings.dailyGoal = (v &gt; 0) ? v : null;
    saveStore();
    renderStats();
  });

  const customAoNInput = document.getElementById('customAoNInput');
  customAoNInput.value = store.settings.customAoN || '';
  customAoNInput.addEventListener('change', ()=&gt;{
    const v = parseInt(customAoNInput.value, 10);
    store.settings.customAoN = (v &gt; 0) ? v : null;
    saveStore();
    renderStats();
  });

  const goalTimeInput = document.getElementById('goalTimeInput');
  goalTimeInput.value = store.settings.goalTime || '';
  goalTimeInput.addEventListener('change', ()=&gt;{
    const v = parseFloat(goalTimeInput.value);
    store.settings.goalTime = (v &gt; 0) ? v : null;
    saveStore();
  });

  let wakeLock = null;
  async function requestWakeLock(){
    if(!('wakeLock' in navigator)) return;
    try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
  }
  function releaseWakeLock(){
    if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
  }
  const wakeLockSwitch = document.getElementById('wakeLockSwitch');
  wireSwitch(wakeLockSwitch, 'wakeLock');
  wakeLockSwitch.addEventListener('click', ()=&gt;{
    if(store.settings.wakeLock) requestWakeLock(); else releaseWakeLock();
  });
  if(store.settings.wakeLock) requestWakeLock();
  document.addEventListener('visibilitychange', ()=&gt;{
    if(document.visibilityState === 'visible' &amp;&amp; store.settings.wakeLock) requestWakeLock();
  });

  const colorblindSwitch = document.getElementById('colorblindSwitch');
  wireSwitch(colorblindSwitch, 'colorblind');
  function applyColorblind(){ document.querySelector('.app').classList.toggle('colorblind', !!store.settings.colorblind); }
  applyColorblind();
  colorblindSwitch.addEventListener('click', applyColorblind);

  const compactSwitch = document.getElementById('compactSwitch');
  wireSwitch(compactSwitch, 'compact');
  function applyCompact(){ document.querySelector('.app').classList.toggle('compact', !!store.settings.compact); }
  applyCompact();
  compactSwitch.addEventListener('click', applyCompact);

  function buzz(){
    if(store.settings.vibrate &amp;&amp; navigator.vibrate){
      try{ navigator.vibrate(25); }catch(e){}
    }
  }

  function renderAccentSwatches(){
    const wrap = document.getElementById('accentSwatches');
    wrap.innerHTML = ACCENTS.map(c=&gt;`&lt;button class=&quot;swatch${c===store.settings.accent?' active':''}&quot; data-c=&quot;${c}&quot; style=&quot;background:${c}&quot;&gt;&lt;/button&gt;`).join('');
    wrap.querySelectorAll('.swatch').forEach(btn=&gt;{
      btn.addEventListener('click', ()=&gt;{
        const c = btn.getAttribute('data-c');
        store.settings.accent = c;
        document.documentElement.style.setProperty('--accent', c);
        saveStore();
        renderAccentSwatches();
      });
    });
  }
  document.documentElement.style.setProperty('--accent', store.settings.accent || ACCENTS[0]);
  renderAccentSwatches();

  document.getElementById('tabTrend').addEventListener('click', ()=&gt;{
    graphMode = 'trend';
    document.getElementById('tabTrend').classList.add('active');
    document.getElementById('tabHist').classList.remove('active');
    renderGraph();
  });
  document.getElementById('tabHist').addEventListener('click', ()=&gt;{
    graphMode = 'hist';
    document.getElementById('tabHist').classList.add('active');
    document.getElementById('tabTrend').classList.remove('active');
    renderGraph();
  });

  document.getElementById('exportBackup').addEventListener('click', ()=&gt;{
    downloadFile(JSON.stringify(store, null, 2), 'sub-timer-backup.json', 'application/json');
  });
  document.getElementById('importBackup').addEventListener('click', ()=&gt;{
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e)=&gt;{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=&gt;{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== 'object' || !parsed.sessions){
          alert('That file doesn\'t look like a Sub backup.');
          return;
        }
        if(confirm('Import this backup? It will replace all current data.')){
          store = parsed;
          migrateStore();
          saveStore();
          currentPuzzle = store.lastPuzzle &amp;&amp; PUZZLES.includes(store.lastPuzzle) ? store.lastPuzzle : &quot;3x3x3&quot;;
          puzzleSelect.value = currentPuzzle;
          document.documentElement.style.setProperty('--accent', store.settings.accent || ACCENTS[0]);
          renderAccentSwatches();
          inspectSelect.value = String(store.settings.inspect || 0);
          document.getElementById('hideTimeSwitch').classList.toggle('on', !!store.settings.hideTime);
          document.getElementById('soundSwitch').classList.toggle('on', !!store.settings.sound);
          document.getElementById('fruSwitch').classList.toggle('on', !!store.settings.fru);
          document.getElementById('practiceSwitch').classList.toggle('on', !!store.settings.practice);
          newScramble();
          renderAll();
        }
      }catch(err){
        alert('Could not read that file.');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  // ================= Init =================
  newScramble();
  renderAll();
  renderPatterns();
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
