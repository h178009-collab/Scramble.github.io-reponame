<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161b;
    --surface: #1b1e25;
    --surface-2: #22252e;
    --border: #2a2e38;
    --text: #eef0f3;
    --text-dim: #868c99;
    --text-faint: #4d525f;
    --green: #4caf6d;
    --red: #d9463c;
    --yellow: #e8b83c;
    --blue: #4a7fd6;
    --gold: #e0c04c;
    --accent: #4caf6d;
    --sticker-white:#f2f3f4;
    --sticker-yellow:#f0c419;
    --sticker-red:#df3f3f;
    --sticker-orange:#ef8536;
    --sticker-blue:#3c6fd9;
    --sticker-green:#3fae5a;
    --font-display:'JetBrains Mono', monospace;
    --font-body:'Manrope', sans-serif;
    --bg-glow: #1e2129;
  }
  html.light{
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --border: #dde1e7;
    --text: #1a1d23;
    --text-dim: #5b6270;
    --text-faint: #939aa6;
    --bg-glow: #ffffff;
  }
  html.large-text .page-title{ font-size:32px; }
  html.large-text .page-sub{ font-size:16px; }
  html.large-text h2.section-h{ font-size:22px; }
  html.large-text h3.sub-h{ font-size:17px; }
  html.large-text p{ font-size:16px; }
  html.large-text .callout{ font-size:15px; }
  html.large-text .notation-card .desc{ font-size:14px; }
  html.large-text .step-title{ font-size:16.5px; }
  html.large-text .step p{ font-size:15px; }
  html.large-text .alg-name{ font-size:14px; }
  html.large-text .alg-code{ font-size:15px; }
  html.large-text .stat-label{ font-size:11px; }
  html.large-text .stat-value{ font-size:20px; }
  html.large-text .kbd-hints{ font-size:13px; }
  html.large-text .mod-table{ font-size:15px; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(1200px 600px at 50% -10%, var(--bg-glow) 0%, var(--bg) 60%);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }

  .shell{
    display:grid;
    grid-template-columns: 240px 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){ .shell{ grid-template-columns: 1fr; } }

  /* sidebar */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:20px 14px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    transition:margin-left .2s;
  }
  .shell.sidebar-collapsed .sidebar{ margin-left:-240px; }
  @media (max-width: 860px){
    .sidebar{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); }
    #sidebarCollapseToggle{ display:flex !important; align-items:center; justify-content:center; }
    .shell.sidebar-collapsed .sidebar{ display:none; margin-left:0; }
  }
  .brand{
    font-family:var(--font-display);
    font-weight:800;
    font-size:19px;
    letter-spacing:-0.5px;
    padding:6px 10px 4px;
  }
  .brand span{ color:var(--accent); }
  .brand-tag{ font-size:11px; color:var(--text-faint); padding:0 10px 16px; letter-spacing:.3px; }
  .nav-group-title{
    font-size:10px; text-transform:uppercase; letter-spacing:.8px; font-weight:700;
    color:var(--text-faint); padding:14px 10px 6px;
  }
  .nav-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 10px; border-radius:8px; font-size:13px; font-weight:600;
    color:var(--text-dim); cursor:pointer; transition:background .15s, color .15s;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--text); }
  .nav-item.active{ background:rgba(76,175,109,.14); color:var(--accent); }
  .nav-item .dot{ width:8px; height:8px; border-radius:2px; flex-shrink:0; }

  /* main */
  .main{ padding:32px 40px 80px; max-width:900px; }
  @media (max-width: 860px){ .main{ padding:24px 18px 60px; } }
  .main.flush{ padding:0; max-width:none; height:100vh; }
  .main.flush iframe{ display:block; width:100%; height:100%; border:none; }

  .page-title{ font-size:28px; font-weight:800; letter-spacing:-.5px; margin:0 0 6px; }
  .page-sub{ color:var(--text-dim); font-size:14px; margin:0 0 28px; line-height:1.6; }

  h2.section-h{ font-size:19px; font-weight:800; margin:34px 0 12px; letter-spacing:-.2px; }
  h3.sub-h{ font-size:15px; font-weight:700; margin:22px 0 8px; color:var(--text); }
  p{ line-height:1.7; color:var(--text-dim); font-size:14px; }
  p b, li b{ color:var(--text); }

  .callout{
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:8px; padding:12px 16px; font-size:13px; color:var(--text-dim); margin:14px 0;
    line-height:1.6;
  }

  /* notation grid */
  .notation-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px; margin:14px 0 22px;
  }
  .notation-card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
  }
  .notation-card .letter{
    font-family:var(--font-display); font-weight:800; font-size:18px; color:var(--accent);
  }
  .notation-card .desc{ font-size:12.5px; color:var(--text-dim); margin-top:4px; line-height:1.5; }

  .mod-table{ width:100%; border-collapse:collapse; margin:10px 0 22px; font-size:13px; }
  .mod-table td, .mod-table th{ padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; }
  .mod-table th{ color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; }
  .mod-table td:first-child{ font-family:var(--font-display); color:var(--accent); font-weight:700; }

  /* puzzle page */
  .puzzle-header{ display:flex; align-items:center; gap:12px; margin-bottom:4px; }
  .puzzle-swatch{ width:34px; height:34px; border-radius:8px; flex-shrink:0; }

  .method-tabs{ display:flex; gap:8px; margin:18px 0 20px; border-bottom:1px solid var(--border); }
  .method-tab{
    font-family:var(--font-body); font-weight:700; font-size:13px; padding:10px 4px; margin-bottom:-1px;
    color:var(--text-faint); cursor:pointer; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none;
  }
  .method-tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .method-panel{ display:none; }
  .method-panel.active{ display:block; }

  .step{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; margin:12px 0;
  }
  .step-title{ font-weight:800; font-size:14.5px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .step-num{
    width:22px; height:22px; border-radius:50%; background:var(--accent); color:#0f1410;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0;
  }
  .step p{ margin:6px 0 0; }

  .alg-line{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:9px 13px; margin:8px 0; flex-wrap:wrap;
  }
  .alg-name{ font-size:12.5px; color:var(--text-dim); font-weight:600; min-width:120px; }
  .alg-code{ font-family:var(--font-display); font-size:13px; color:var(--text); letter-spacing:.2px; flex:1; }
  .alg-copy-btn{
    flex-shrink:0; background:none; border:1px solid var(--border); border-radius:6px;
    color:var(--text-faint); font-size:12px; padding:3px 8px; cursor:pointer; transition:color .15s, border-color .15s;
  }
  .alg-copy-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .alg-copy-btn.copied{ color:var(--accent); border-color:var(--accent); }
  .alg-fav-btn{
    flex-shrink:0; background:none; border:1px solid var(--border); border-radius:6px;
    color:var(--text-faint); font-size:13px; padding:3px 8px; cursor:pointer; transition:color .15s, border-color .15s;
  }
  .alg-fav-btn:hover{ color:var(--gold); border-color:var(--gold); }
  .alg-fav-btn.faved{ color:var(--gold); border-color:var(--gold); }

  .notes-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
    font-family:var(--font-body); transition:color .15s, border-color .15s;
  }
  .notes-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .notes-btn.primary{ background:var(--accent); border-color:var(--accent); color:#0f1712; }
  .notes-btn.primary:hover{ color:#0f1712; filter:brightness(1.08); }
  .card-delete-btn:hover{ color:var(--red) !important; border-color:var(--red) !important; }

  @media (max-width: 860px){
    .alg-copy-btn, .alg-fav-btn{ padding:8px 12px; font-size:14px; }
    .pattern-use{ padding:10px 16px !important; }
    .nav-item{ padding:12px 10px; }
    #jumpTop, #printPage, #fontSizeToggle, .fab-copy-algs{
      width:46px !important; height:46px !important; font-size:16px !important;
      bottom:calc(16px + env(safe-area-inset-bottom, 0px)) !important;
    }
    #jumpTop{ right:16px !important; }
    #printPage{ right:70px !important; }
    #fontSizeToggle{ right:124px !important; }
    .fab-copy-algs{ right:178px !important; }
  }
  @media (max-width: 480px){
    #fontSizeToggle, .fab-copy-algs{ display:none !important; }
  }

  /* algorithm sheet (OLL/PLL grids) */
  .alg-toolbar{
    display:flex; gap:8px; align-items:center; margin:14px 0; flex-wrap:wrap;
  }
  .alg-search{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:8px 12px; font-size:13px; font-family:var(--font-body);
    flex:1; min-width:160px; outline:none;
  }
  .alg-count{ font-size:12px; color:var(--text-faint); }

  .alg-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:10px;
  }
  .alg-card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
  }
  .alg-card .num{
    display:inline-block; font-family:var(--font-display); font-size:11px; font-weight:700;
    color:var(--accent); background:rgba(76,175,109,.12); border-radius:5px; padding:2px 7px; margin-bottom:7px;
  }
  .alg-card .code{ font-family:var(--font-display); font-size:12.5px; line-height:1.6; color:var(--text); word-break:break-word; }

  .toc-chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
  .toc-chip{
    font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim); cursor:pointer;
  }
  .toc-chip:hover{ color:var(--accent); border-color:var(--accent); }

  .diag-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; margin:14px 0 22px;
  }
  .diag-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 12px 12px;
    text-align:center;
  }
  .diag-card .diag-title{ font-family:var(--font-display); font-weight:800; font-size:16px; color:var(--text); margin-bottom:8px; }
  .diag-card .diag-desc{ font-size:11.5px; color:var(--text-dim); margin-top:8px; line-height:1.5; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  #jumpTop.show{ opacity:1; pointer-events:auto; }

  @media print{
    .sidebar, #jumpTop, .method-tabs, iframe, .toc-chip-row{ display:none !important; }
    .main{ max-width:none; padding:0; }
    body{ background:#fff; color:#000; }
    .panel, .step, .alg-line, .diag-card, .callout{ border:1px solid #999 !important; background:#fff !important; color:#000 !important; }
    .alg-code, .alg-name, p, h1, h2, h3{ color:#000 !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="brand">Scrambled<span>.</span><button id="themeToggle" title="Toggle light/dark theme" aria-label="Toggle light/dark theme" style="float:right; background:none; border:1px solid var(--border); border-radius:6px; color:var(--text-faint); font-size:12px; padding:3px 7px; cursor:pointer;">☾</button></div>
    <div class="brand-tag">how to solve every twisty puzzle</div>
    <button id="copyLinkBtn" title="Copy link to share" style="width:100%; margin:0 0 10px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:8px 10px; font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font-body); display:flex; align-items:center; justify-content:center; gap:6px;"><span>🔗</span> Copy link to share</button>
    <input type="text" id="sidebarSearch" placeholder="Search pages..." aria-label="Search site pages" style="width:100%; margin:6px 0 10px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:12px; font-family:var(--font-body);">
    <div class="nav-group-title">Practice</div>
    <div class="nav-item" data-page="timer"><span class="dot" style="background:var(--gold)"></span>Timer</div>
    <div class="nav-group-title">Start here</div>
    <div class="nav-item" data-page="notation"><span class="dot" style="background:var(--accent)"></span>Notation</div>
    <div class="nav-item" data-page="fingertricks"><span class="dot" style="background:#c15fd6"></span>Finger Tricks</div>
    <div class="nav-group-title">Cubes</div>
    <div class="nav-item" data-page="2x2"><span class="dot" style="background:var(--sticker-red)"></span>2x2</div>
    <div class="nav-item" data-page="3x3"><span class="dot" style="background:var(--sticker-blue)"></span>3x3</div>
    <div class="nav-item" data-page="4x4"><span class="dot" style="background:var(--sticker-orange)"></span>4x4</div>
    <div class="nav-item" data-page="bignxn"><span class="dot" style="background:var(--sticker-yellow)"></span>5x5 – 7x7</div>
    <div class="nav-group-title">Other shapes</div>
    <div class="nav-item" data-page="pyraminx"><span class="dot" style="background:var(--sticker-green)"></span>Pyraminx</div>
    <div class="nav-item" data-page="skewb"><span class="dot" style="background:#c15fd6"></span>Skewb</div>
    <div class="nav-item" data-page="megaminx"><span class="dot" style="background:#e0668e"></span>Megaminx</div>
    <div class="nav-item" data-page="square1"><span class="dot" style="background:#4a7fd6"></span>Square-1</div>
    <div class="nav-group-title">&nbsp;</div>
    <div class="nav-item" data-page="notes"><span class="dot" style="background:#4a7fd6"></span>Notes</div>
    <div class="nav-item" data-page="favorites"><span class="dot" style="background:var(--gold)"></span>Favorites</div>
    <div class="nav-item" data-page="competitions"><span class="dot" style="background:#e0668e"></span>Competitions</div>
    <div class="nav-item" data-page="credits"><span class="dot" style="background:var(--text-faint)"></span>Credits</div>
    <div class="nav-group-title">Backup everything</div>
    <div style="display:flex; gap:6px; padding:0 2px;">
      <button id="exportAllBtn" style="flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); border-radius:7px; padding:7px 4px; font-size:11px; font-weight:700; cursor:pointer; font-family:var(--font-body);">Export</button>
      <button id="importAllBtn" style="flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); border-radius:7px; padding:7px 4px; font-size:11px; font-weight:700; cursor:pointer; font-family:var(--font-body);">Import</button>
      <input type="file" id="importAllFile" accept="application/json" style="display:none;">
    </div>
    <div style="font-size:10px; color:var(--text-faint); padding:6px 2px 0;">Timer + Notes + Favorites, all in one file</div>

    <div class="nav-group-title">Where should we shop?</div>
    <select id="shoppingRegionSelect" style="width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:12px; font-family:var(--font-body);">
      <option value="">Pick your region...</option>
      <option value="india">India — Cubelelo</option>
      <option value="intl">Everywhere else — TheCubicle</option>
    </select>
    <div id="shoppingRegionLink" style="font-size:11px; padding:8px 2px 0; color:var(--text-faint);"></div>
  </nav>

  <main class="main" id="main"></main>
  <button id="jumpTop" title="Jump to top" aria-label="Jump to top of page" style="position:fixed; bottom:24px; right:24px; width:40px; height:40px; border-radius:50%; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); cursor:pointer; font-size:16px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:15;">↑</button>
  <button id="printPage" title="Print this page" aria-label="Print this page" style="position:fixed; bottom:24px; right:74px; width:40px; height:40px; border-radius:50%; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); cursor:pointer; font-size:15px; z-index:15;">⎙</button>

function faceNetSvg(highlightFaces, opts){
  opts = opts || {};
  const cell = 44, gap = 4;
  const pos = {
    U: [44+gap, 0],
    L: [0, 44+gap],
    F: [44+gap, 44+gap],
    R: [(44+gap)*2, 44+gap],
    B: [(44+gap)*3, 44+gap],
    D: [44+gap, (44+gap)*2]
  };
  const w = (44+gap)*4 - gap, h = (44+gap)*3 - gap;
  const hi = new Set(highlightFaces);
  let out = '';
  Object.keys(pos).forEach(f=>{
    const [x,y] = pos[f];
    const on = hi.has(f);
    out += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="6" fill="${on?'var(--accent)':'var(--surface-2)'}" fill-opacity="${on?'0.25':'1'}" stroke="${on?'var(--accent)':'var(--border)'}" stroke-width="${on?2:1}"/>`;
    if(!on){
      out += `<text x="${x+cell/2}" y="${y+cell/2+4}" text-anchor="middle" font-size="11" font-family="JetBrains Mono, monospace" fill="var(--text-faint)" font-weight="700">${f}</text>`;
    }
  });
  if(opts.arrow){
    let ax, ay;
    if(opts.between){
      const [x1,y1] = pos[opts.between[0]], [x2,y2] = pos[opts.between[1]];
      ax = (x1+x2)/2 + cell/2; ay = (y1+y2)/2 + cell/2;
    } else {
      const [x,y] = pos[highlightFaces[0]];
      ax = x + cell/2; ay = y + cell/2;
    }
    out += `<text x="${ax}" y="${ay+9}" text-anchor="middle" font-size="28" fill="var(--accent)">${opts.arrow}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:170px;height:auto;display:block;margin:0 auto;">${out}</svg>`;
}

function layerStackSvg(highlightCount, arrow){
  // 3 vertical bars representing outer/middle/outer layers, highlightCount of them lit up from the left
  const bars = [0,1,2];
  let out = '';
  bars.forEach(i=>{
    const x = 4 + i*48;
    const on = i < highlightCount;
    out += `<rect x="${x}" y="10" width="40" height="64" rx="7" fill="${on?'var(--accent)':'var(--surface-2)'}" fill-opacity="${on?'0.25':'1'}" stroke="${on?'var(--accent)':'var(--border)'}" stroke-width="${on?2:1}"/>`;
  });
  const midX = 4 + ((highlightCount-1)/2)*48 + 20;
  out += `<text x="${midX}" y="50" text-anchor="middle" font-size="24" fill="var(--accent)">${arrow}</text>`;
  return `<svg viewBox="0 0 148 84" style="width:100%;max-width:150px;height:auto;display:block;margin:0 auto;">${out}</svg>`;
}

function sliceMidSvg(arrow){

}

function cornerAxisSvg(shape, label, corners, arrow){
  // shape: 'triangle' or 'square' outline with labeled corner dots, one highlighted with a rotation arrow
  const outline = shape === 'triangle'
    ? '<path d="M70,18 L18,112 L122,112 Z" fill="none" stroke="var(--border)" stroke-width="1.5"/>'
    : '<rect x="10" y="10" width="120" height="112" rx="10" fill="none" stroke="var(--border)" stroke-width="1.5"/>';
  let dots = '';
  Object.keys(corners).forEach(c=>{
    const [x,y] = corners[c];
    const on = c === label;
    dots += `<circle cx="${x}" cy="${y}" r="15" fill="${on?'var(--accent)':'var(--surface-2)'}" fill-opacity="${on?'0.3':'1'}" stroke="${on?'var(--accent)':'var(--border)'}" stroke-width="2"/>`;

  });
  let arrowSvg = '';
  if(arrow){
    const [x,y] = corners[label];
    const ay = y < 60 ? y - 26 : y - 26;
    arrowSvg = `<text x="${x}" y="${ay}" text-anchor="middle" font-size="18" fill="var(--accent)">${arrow}</text>`;
  }
  return `<svg viewBox="0 0 140 130" style="width:100%;max-width:150px;height:auto;display:block;margin:0 auto;">${outline}${dots}${arrowSvg}</svg>`;

// litRows: rows (0=top..n-1=bottom) fully solved/filled. outlineRows: rows oriented-but-not-placed (outline only).
function progressGridSvg(rowCount, litRows, outlineRows, size, inline){
  const cell = size || 34, gap = 3;
  let out = '';
  for(let r=0; r<rowCount; r++){
    for(let c=0; c<3; c++){
      const x = c*(cell+gap), y = r*(cell+gap);
      const filled = litRows.includes(r);
      const outline = outlineRows && outlineRows.includes(r);
      let fill = 'var(--surface-2)', stroke = 'var(--border)', sw = 1, op = 1;
      if(filled){ fill = 'var(--accent)'; stroke = 'var(--accent)'; sw = 2; op = 0.35; }
      else if(outline){ fill = 'none'; stroke = 'var(--accent)'; sw = 2; op = 1; }
      out += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="5" fill="${fill}" fill-opacity="${op}" stroke="${stroke}" stroke-width="${sw}"/>`;
    }
  }
  const w = 3*cell + 2*gap, h = rowCount*cell + (rowCount-1)*gap;
  const style = inline
    ? `width:${cell*2.4}px;height:auto;display:inline-block;vertical-align:middle;flex-shrink:0;`
    : `width:${cell*2.4}px;height:auto;display:block;margin:0 auto 8px;`;
  return `<svg viewBox="0 0 ${w} ${h}" style="${style}">${out}</svg>`;
}

};

function creditLine(channel, videoTitle, url){
  return `<div class="alg-line" style="justify-content:flex-start; gap:14px;"><span class="alg-name" style="min-width:110px;">${channel}</span><a href="${url}" target="_blank" style="font-size:13px; color:var(--text-dim);">${videoTitle}</a></div>`;

function cfopFlowSvg(rowCount, steps){
  // steps: array of {label, litRows, outlineRows}
  let cells = '';
  steps.forEach((s,i)=>{
    cells += `<div style="text-align:center;">${progressGridSvg(rowCount, s.litRows, s.outlineRows, 26)}<div style="font-size:10px;color:var(--text-faint);font-weight:700;">${s.label}</div></div>`;
    if(i < steps.length-1) cells += `<div style="color:var(--text-faint);font-size:16px;align-self:center;">→</div>`;
  });
  return `<div style="display:flex; align-items:flex-start; gap:10px; justify-content:center; flex-wrap:wrap; margin:16px 0 22px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;">${cells}</div>`;
}

function notationPage(){
  return `
  <h1 class="page-title">Notation</h1>
  <p class="page-sub">Every puzzle on this site has its own notation. This page covers all of them — cube-style puzzles (2x2 through 7x7) share one system; Pyraminx, Skewb, Megaminx, and Square-1 each have their own quirks. In every diagram, the highlighted piece is what turns, and ↻ shows which way.</p>

  <h2 class="section-h">Cube notation — 2x2, 3x3, 4x4, 5x5, 6x6, 7x7</h2>
  <p>Hold the cube with one color facing you (Front) and one on top (Up). Each letter is a face, turned 90° clockwise as you look directly at that face. This is the same system across every size of cube — bigger cubes just add a few extra symbols on top.</p>

  <h3 class="sub-h">The 6 faces</h3>
  <div class="diag-grid">
    <div class="diag-card">${faceNetSvg(['U'], {arrow:'↻'})}<div class="diag-title">U</div><div class="diag-desc">Up — the top face</div></div>
    <div class="diag-card">${faceNetSvg(['D'], {arrow:'↻'})}<div class="diag-title">D</div><div class="diag-desc">Down — the bottom face</div></div>
    <div class="diag-card">${faceNetSvg(['L'], {arrow:'↻'})}<div class="diag-title">L</div><div class="diag-desc">Left face</div></div>
    <div class="diag-card">${faceNetSvg(['R'], {arrow:'↻'})}<div class="diag-title">R</div><div class="diag-desc">Right face</div></div>
    <div class="diag-card">${faceNetSvg(['F'], {arrow:'↻'})}<div class="diag-title">F</div><div class="diag-desc">Front — facing you</div></div>
    <div class="diag-card">${faceNetSvg(['B'], {arrow:'↻'})}<div class="diag-title">B</div><div class="diag-desc">Back — facing away</div></div>
  </div>
  ${calloutBlock("Every diagram on this page is the same net unfolded — imagine peeling the 6 faces of the cube flat. U sits above F because on the real cube, U is directly above the face you're looking at.")}

  <h3 class="sub-h">Modifiers — apply to every letter, on every puzzle</h3>
  <table class="mod-table">
    <tr><th>Symbol</th><th>Meaning</th></tr>
    <tr><td>R</td><td>Turn that face 90° clockwise (the arrow direction shown above)</td></tr>
    <tr><td>R'</td><td>("R prime") Turn that face 90° the other way — counter-clockwise</td></tr>
    <tr><td>R2</td><td>Turn that face 180° — a double turn, direction doesn't matter</td></tr>
  </table>

  <h3 class="sub-h">Wide moves — 4x4 and up</h3>
  <p>On bigger cubes you sometimes need to turn the outer face plus the layer directly behind it, together, as one chunk.</p>
  <div class="diag-grid">
    <div class="diag-card">${layerStackSvg(2, '↻')}<div class="diag-title">Rw / r</div><div class="diag-desc">Right face + the layer behind it, together</div></div>
    <div class="diag-card">${layerStackSvg(3, '↻')}<div class="diag-title">3Rw / 3R</div><div class="diag-desc">Same idea, 3 layers deep — used on 5x5 and up</div></div>
  </div>
  <p>The same lowercase-or-<span class="alg-code">w</span> pattern works for every face: <span class="alg-code">Uw / u</span>, <span class="alg-code">Fw / f</span>, <span class="alg-code">Dw / d</span>, <span class="alg-code">Lw / l</span>, <span class="alg-code">Bw / b</span>.</p>

  <h3 class="sub-h">Slice moves — 3x3 only</h3>
  <p>These turn <b>only</b> a middle layer, leaving both outer layers completely alone.</p>
  <div class="diag-grid">
    <div class="diag-card">${sliceMidSvg('↻')}<div class="diag-title">M</div><div class="diag-desc">Middle layer between L and R — turns the direction of L</div></div>
    <div class="diag-card">${sliceMidSvg('↻')}<div class="diag-title">E</div><div class="diag-desc">Equatorial layer between U and D — turns the direction of D</div></div>
    <div class="diag-card">${sliceMidSvg('↻')}<div class="diag-title">S</div><div class="diag-desc">Standing layer between F and B — turns the direction of F</div></div>
  </div>

  <h3 class="sub-h">Whole-cube rotations</h3>
  <p>These spin the <b>entire puzzle</b> in your hands — no pieces move relative to each other, you're just changing which face you're looking at. Used to set up an algorithm from a comfortable angle.</p>
  <div class="diag-grid">
    <div class="diag-card">${faceNetSvg(['U','D','L','R','F','B'], {arrow:'↻', between:['F','R']})}<div class="diag-title">x</div><div class="diag-desc">Whole cube rotates like an R turn</div></div>
    <div class="diag-card">${faceNetSvg(['U','D','L','R','F','B'], {arrow:'↻', between:['U','F']})}<div class="diag-title">y</div><div class="diag-desc">Whole cube rotates like a U turn</div></div>
    <div class="diag-card">${faceNetSvg(['U','D','L','R','F','B'], {arrow:'↻', between:['F','U']})}<div class="diag-title">z</div><div class="diag-desc">Whole cube rotates like an F turn</div></div>
  </div>
  ${calloutBlock("Parentheses in an algorithm — like <span class='alg-code'>(R U R' U')</span> — just group moves that flow together as one finger trick. They don't change what the moves do.")}

  <h2 class="section-h">Pyraminx notation</h2>
  <p>Pyraminx moves are named after the 4 corners of the tetrahedron, not faces. Each letter twists everything around that corner's axis.</p>
  <div class="diag-grid">
    <div class="diag-card">${cornerAxisSvg('triangle','U',{U:[70,18],L:[18,112],R:[122,112]},'↻')}<div class="diag-title">U</div><div class="diag-desc">Top corner</div></div>
    <div class="diag-card">${cornerAxisSvg('triangle','L',{U:[70,18],L:[18,112],R:[122,112]},'↻')}<div class="diag-title">L</div><div class="diag-desc">Bottom-left corner</div></div>
    <div class="diag-card">${cornerAxisSvg('triangle','R',{U:[70,18],L:[18,112],R:[122,112]},'↻')}<div class="diag-title">R</div><div class="diag-desc">Bottom-right corner</div></div>
  </div>
  <p><span class="alg-code">B</span> is the fourth corner, hidden behind the puzzle in this view — same idea, just facing away from you.</p>
  <table class="mod-table">
    <tr><th>Symbol</th><th>Meaning</th></tr>
    <tr><td>U, L, R, B</td><td>Turn the 2 layers at that corner together, 120° clockwise</td></tr>
    <tr><td>U', L', R', B'</td><td>Same corner, counter-clockwise</td></tr>
    <tr><td>u, l, r, b</td><td>Lowercase — turn <b>only the small tip</b> at that corner, not the layer behind it</td></tr>
  </table>

  <h2 class="section-h">Skewb notation</h2>
  <p>Skewb looks like a cube but every move twists around a <b>corner</b>, not a face — there's no such thing as turning just "the top layer." The same letters as a cube (U, L, R, B) are reused here, but they mean corner axes.</p>
  <div class="diag-grid">
    <div class="diag-card">${cornerAxisSvg('square','U',{U:[24,24],L:[24,108],R:[116,24],B:[116,108]},'↻')}<div class="diag-title">U</div><div class="diag-desc">Top-left corner axis</div></div>
    <div class="diag-card">${cornerAxisSvg('square','L',{U:[24,24],L:[24,108],R:[116,24],B:[116,108]},'↻')}<div class="diag-title">L</div><div class="diag-desc">Bottom-left corner axis</div></div>
    <div class="diag-card">${cornerAxisSvg('square','R',{U:[24,24],L:[24,108],R:[116,24],B:[116,108]},'↻')}<div class="diag-title">R</div><div class="diag-desc">Top-right corner axis</div></div>
    <div class="diag-card">${cornerAxisSvg('square','B',{U:[24,24],L:[24,108],R:[116,24],B:[116,108]},'↻')}<div class="diag-title">B</div><div class="diag-desc">Bottom-right corner axis</div></div>
  </div>
  <table class="mod-table">
    <tr><th>Symbol</th><th>Meaning</th></tr>
    <tr><td>R, L, U, B</td><td>Turn around that corner axis, clockwise as you look at it</td></tr>
    <tr><td>R', L', U', B'</td><td>Same axis, counter-clockwise</td></tr>
    <tr><td>x, y, z</td><td>Whole-puzzle rotations, same idea as on a 3x3</td></tr>
  </table>

  <h2 class="section-h">Megaminx notation</h2>
  <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
    <div style="flex-shrink:0;">${pentagonSvg()}</div>
    <p style="flex:1; min-width:220px;">Megaminx reuses the exact same letters as a 3x3 — U, R, F, L, D, B — and they mean the same thing: turn that face clockwise. The only real difference is a pentagon has <b>5</b> neighbors instead of 4, so there are more possible faces an algorithm can reference, and a couple of extra letters (like <span class="alg-code">BL</span>, <span class="alg-code">BR</span>, <span class="alg-code">DR</span>, <span class="alg-code">DL</span>) show up for the faces that don't exist on a cube.</p>
  </div>
  <table class="mod-table">
    <tr><th>Symbol</th><th>Meaning</th></tr>
    <tr><td>R, U, F, L, D, B...</td><td>Same clockwise-turn rule as a 3x3, just on a 5-sided face</td></tr>
    <tr><td>R', U', F'...</td><td>Counter-clockwise, same as always</td></tr>
  </table>

  <h2 class="section-h">Square-1 notation</h2>
  <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap;">
    <div style="flex-shrink:0;">${square1Svg()}</div>
    <p style="flex:1; min-width:220px;">Square-1 doesn't use letters at all. Instead, <span class="alg-code">(x,y)</span> means: rotate the <b>top</b> layer by <span class="alg-code">x</span> twelfths of a turn, and the <b>bottom</b> layer by <span class="alg-code">y</span> twelfths — positive numbers clockwise, negative counter-clockwise, done at the same time. A <span class="alg-code">/</span> on its own means flip the middle layer 180°, like closing a book.</p>
  </div>
  <table class="mod-table">
    <tr><th>Symbol</th><th>Meaning</th></tr>
    <tr><td>(3,-3)</td><td>Top layer turns 3 twelfths clockwise, bottom turns 3 twelfths counter-clockwise</td></tr>
    <tr><td>(0,6)</td><td>Top layer stays still, bottom layer turns halfway around</td></tr>
    <tr><td>/</td><td>Flip the middle (equator) layer 180°</td></tr>
  </table>
  `;
}

function pageFingerTricks(){
  return `
  <h1 class="page-title">Finger Tricks</h1>
  <p class="page-sub">The difference between "knowing" an algorithm and executing it fast isn't the moves — it's how little your hands move between them. Finger tricks are how you turn faces without regripping the cube.</p>

  <h2 class="section-h">The grip</h2>
  <p>Hold the cube loosely, mostly with your fingertips rather than your palms — your hands should be able to flex and turn faces without needing to let go and reposition. Most solvers rest the cube on their ring and pinky fingers, freeing the index, middle, and thumb to do the actual turning.</p>
  ${calloutBlock("Don't grip tightly. A relaxed hold is what lets your fingers flick a face 90° while the rest of the cube stays put in your palm.")}

  <h2 class="section-h">The core tricks, move by move</h2>
  ${stepBlock("U", "U / U'", "Push the top layer with your index finger (U) or pull it back (U'). This almost never requires regripping — it's the cheapest move on the cube.")}
  ${stepBlock("R", "R / R'", "Push up with your ring finger (R) or pull down with your index finger (R'). This is the single most common face in speedsolving algorithms, so this trick alone carries most of your speed.")}
  ${stepBlock("L", "L / L'", "Mirror of R — push with your left index finger, pull with your left ring/middle finger. Less common in right-handed-heavy algorithms, but essential for OLL/PLL.")}
  ${stepBlock("F", "F / F'", "Usually turned with the thumb pushing up, or the index/middle finger from below. Often the move that forces a small regrip since it faces you directly.")}
  ${stepBlock("M", "M-slice", "Turn with your right middle finger (pulling the middle layer the same direction as an L turn), while your other fingers keep the outer layers stationary. Core to every M-slice PLL (H, Z, Ua, Ub).")}

  <h2 class="section-h">Common trigger combos</h2>
  <p>Certain move pairs show up constantly and are worth drilling as a single motion rather than two separate turns.</p>
  ${algLine("Sexy move", "R U R' U'  — the most repeated 4 moves in cubing")}
  ${algLine("Sledgehammer", "R' F R F'  — used across 3x3, Skewb, and more")}
  ${algLine("Hedgeslammer", "F R' F' R  — the mirror of the sledgehammer")}
  ${algLine("Sune trigger", "R U R' U R U2' R'  — practice as one flowing motion, not 7 separate turns")}

  <h2 class="section-h">How to actually get faster</h2>
  ${stepBlock(1, "Slow reps before fast reps", "Do a trick slowly and cleanly 10 times before trying to speed it up. Speed you build on a sloppy motion just locks in the sloppiness.")}
  ${stepBlock(2, "Isolate one trigger at a time", "Don't try to learn finger tricks for an entire algorithm at once. Drill R U R' U' alone until it's automatic, then move to the next chunk.")}
  ${stepBlock(3, "Watch for wasted regrips", "Film your hands (even just your phone camera) and look for moments your grip resets mid-algorithm — those are almost always fixable with a different finger.")}
  ${stepBlock(4, "Use a well-tensioned cube", "Finger tricks that work great on a loose, fast cube can lock up on a stiff one. If you're fighting the cube itself, no amount of trick refinement will help.")}
  ${calloutBlock("Finger tricks aren't something you memorize from a list — they're something you build through repetition. Everything above is a starting shape; your hands will adapt it to what's comfortable for you.")}
  `;
}

function b64DecodeUnicode(str){
  return decodeURIComponent(Array.prototype.map.call(atob(str), function(c){
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
}

const PAGES = {
  notation: notationPage,
  fingertricks: pageFingerTricks,
  "2x2": page2x2,
  "3x3": page3x3,
  "4x4": page4x4,
  bignxn: pageBigNxN,
  pyraminx: pagePyraminx,
  skewb: pageSkewb,
  megaminx: pageMegaminx,
  square1: pageSquare1,
  notes: pageNotes,
  favorites: pageFavorites,
  competitions: pageCompetitions,
  credits: pageCredits
};

const main = document.getElementById('main');

const PAGE_ORDER = ['notation','fingertricks','2x2','3x3','4x4','bignxn','pyraminx','skewb','megaminx','square1'];

function trackRecentlyViewed(id){
  if(id === 'timer' || id === 'favorites' || id === 'credits') return;
  try{
    let recent = JSON.parse(localStorage.getItem('learn-recent') || '[]');
    recent = recent.filter(r=>r!==id);
    recent.unshift(id);
    recent = recent.slice(0,5);
    localStorage.setItem('learn-recent', JSON.stringify(recent));
  }catch(e){}
}

function pageLabel(id){
  const map = {notation:'Notation', fingertricks:'Finger Tricks', '2x2':'2x2', '3x3':'3x3', '4x4':'4x4', bignxn:'5x5-7x7', pyraminx:'Pyraminx', skewb:'Skewb', megaminx:'Megaminx', square1:'Square-1'};
  return map[id] || id;
}

function renderPageNav(id){
  const idx = PAGE_ORDER.indexOf(id);
  if(idx === -1) return '';
  const prev = idx > 0 ? PAGE_ORDER[idx-1] : null;
  const next = idx < PAGE_ORDER.length-1 ? PAGE_ORDER[idx+1] : null;
  return `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:32px; padding-top:16px; border-top:1px solid var(--border); font-size:12px; color:var(--text-faint);">
    <span>${prev ? `<span class="toc-chip" data-goto="${prev}">← ${pageLabel(prev)}</span>` : ''}</span>
    <span>Page ${idx+1} of ${PAGE_ORDER.length}</span>
    <span>${next ? `<span class="toc-chip" data-goto="${next}">${pageLabel(next)} →</span>` : ''}</span>
  </div>`;
}

const TIMER_STORE_KEY = 'sub-timer-data-v2';
let timerFrameRef = null;

function sendTimerInit(){
  if(!timerFrameRef) return;
  let payload = null;
  try{
    const raw = localStorage.getItem(TIMER_STORE_KEY);
    if(raw) payload = JSON.parse(raw);
  }catch(e){}
  const theme = localStorage.getItem('learn-theme') === 'light' ? 'light' : 'dark';
  try{ timerFrameRef.contentWindow.postMessage({ type: 'sub-timer-init', payload, theme }, '*'); }catch(e){}
}

window.addEventListener('message', (ev)=>{
  if(!ev.data || !timerFrameRef || ev.source !== timerFrameRef.contentWindow) return;
  if(ev.data.type === 'sub-timer-save'){
    try{ localStorage.setItem(TIMER_STORE_KEY, JSON.stringify(ev.data.payload)); }catch(e){}
  } else if(ev.data.type === 'sub-timer-ready'){
    sendTimerInit();
  }
});

function downloadFile(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportAllData(){
  let timerData = null;
  try{ const raw = localStorage.getItem(TIMER_STORE_KEY); if(raw) timerData = JSON.parse(raw); }catch(e){}
  const bundle = {
    exportedFrom: 'Scrambled',
    exportedAt: new Date().toISOString(),
    timer: timerData,
    notes: localStorage.getItem('learn-notes') || '',
    favorites: (()=>{ try{ return JSON.parse(localStorage.getItem('learn-favorites') || '[]'); }catch(e){ return []; } })(),
    algCards: (()=>{ try{ return JSON.parse(localStorage.getItem('learn-alg-cards') || '[]'); }catch(e){ return []; } })()
  };
  downloadFile(JSON.stringify(bundle, null, 2), 'scrambled-backup.json', 'application/json');
}

function importAllData(parsed){
  if(parsed.timer){
    try{ localStorage.setItem(TIMER_STORE_KEY, JSON.stringify(parsed.timer)); }catch(e){}
  }
  if(typeof parsed.notes === 'string'){
    try{ localStorage.setItem('learn-notes', parsed.notes); }catch(e){}
  }
  if(Array.isArray(parsed.favorites)){
    try{ localStorage.setItem('learn-favorites', JSON.stringify(parsed.favorites)); }catch(e){}
  }
  if(Array.isArray(parsed.algCards)){
    try{ localStorage.setItem('learn-alg-cards', JSON.stringify(parsed.algCards)); }catch(e){}
  }
  sendTimerInit();
  const currentId = document.querySelector('.nav-item.active')?.getAttribute('data-page');
  if(currentId === 'notes' || currentId === 'favorites') renderPage(currentId);
}

document.getElementById('exportAllBtn').addEventListener('click', exportAllData);
document.getElementById('importAllBtn').addEventListener('click', ()=>{

});

document.getElementById('copyLinkBtn').addEventListener('click', ()=>{
  const btn = document.getElementById('copyLinkBtn');
  const url = window.location.href;
  const onDone = ()=>{
    const orig = btn.innerHTML;
    btn.innerHTML = '<span>✓</span> Link copied!';
    setTimeout(()=>{ btn.innerHTML = orig; }, 1500);
  };
  const fallbackCopy = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      onDone();
    }catch(err){}
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(onDone).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
});

document.getElementById('importAllFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object'){
        alert("That file doesn't look like a Scrambled backup.");
        return;
      }
      if(confirm('Import this backup? It will replace your current Timer data, Notes, and Favorites.')){
        importAllData(parsed);
        alert('Backup imported successfully.');
      }
    }catch(err){
      alert('Could not read that file.');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

function renderPage(id){
  if(id === 'timer'){
    main.className = 'main flush';
    main.innerHTML = '<iframe id="timerFrame" title="Sub cube timer"></iframe>';
    timerFrameRef = document.getElementById('timerFrame');
    timerFrameRef.srcdoc = b64DecodeUnicode(TIMER_HTML_B64);
    timerFrameRef.addEventListener('load', sendTimerInit);
  } else {
    main.className = 'main';
    main.innerHTML = PAGES[id]() + renderPageNav(id);
    wireMethodTabs();
    if(id === '3x3') wire3x3Extras();
    if(id === 'pyraminx') wirePyraminx();
    if(id === 'favorites') wireFavoritesPage();
    if(id === 'notes') wireNotesPage();
    if(id === 'competitions') wireCompetitionsPage();
    if(id === 'megaminx') wireMegaminx();
    markFavButtons();
    main.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> renderPage(el.getAttribute('data-goto')));
    });
  }
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-page') === id);
  });
  window.scrollTo(0,0);
  trackRecentlyViewed(id);
  if(typeof updateCopyAllAlgsVisibility === 'function') updateCopyAllAlgsVisibility();
  try{ localStorage.setItem('learn-last-page', id); }catch(e){}
}

function wireMethodTabs(){
  document.querySelectorAll('.method-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const group = tab.closest('.method-tabs');
      group.querySelectorAll('.method-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const container = group.parentElement;
      container.querySelectorAll('.method-panel').forEach(p=>p.classList.remove('active'));
      document.getElementById(tab.getAttribute('data-tab')).classList.add('active');
    });
  });
}

function getAlgCards(){
  try{ return JSON.parse(localStorage.getItem('learn-alg-cards') || '[]'); }catch(e){ return []; }
}
function saveAlgCards(cards){
  try{ localStorage.setItem('learn-alg-cards', JSON.stringify(cards)); }catch(e){}
}

function renderAlgCards(){
  const el = document.getElementById('cardsList');
  if(!el) return;
  const cards = getAlgCards();
  if(!cards.length){
    el.innerHTML = '<div class="empty-note">No cards yet — add one above.</div>';
    return;
  }
  el.innerHTML = cards.map(c => `
    <div class="alg-line" style="flex-direction:column; align-items:stretch; gap:6px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span class="alg-name" style="font-size:13px; min-width:0;">${c.name || '(untitled)'}</span>
        <div style="display:flex; gap:6px; flex-shrink:0;">
          <button class="alg-copy-btn" data-card-edit="${c.id}" title="Edit card" aria-label="Edit ${c.name || 'card'}">✎</button>
          <button class="alg-copy-btn" data-card-copy="${c.id}" title="Copy algorithm" aria-label="Copy ${c.name || 'algorithm'}">⧉</button>
          <button class="alg-copy-btn card-delete-btn" data-card-delete="${c.id}" title="Delete card" aria-label="Delete ${c.name || 'card'}">✕</button>
        </div>
      </div>
      <span class="alg-code">${c.alg || ''}</span>
      ${c.desc ? `<span style="font-size:12px; color:var(--text-dim); line-height:1.5;">${c.desc}</span>` : ''}
    </div>
  `).join('');

  el.querySelectorAll('[data-card-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-card-edit');
      const card = getAlgCards().find(c => c.id === id);
      if(!card) return;
      document.getElementById('cardNameInput').value = card.name || '';
      document.getElementById('cardAlgInput').value = card.alg || '';
      document.getElementById('cardDescInput').value = card.desc || '';
      const addBtn = document.getElementById('cardAddBtn');
      addBtn.textContent = 'Save changes';
      addBtn.setAttribute('data-editing-id', id);
      document.getElementById('cardCancelEditBtn').style.display = 'inline-block';
      try{ document.getElementById('cardNameInput').scrollIntoView({ behavior:'smooth', block:'center' }); }catch(e){}
      document.getElementById('cardNameInput').focus();
    });
  });

  el.querySelectorAll('[data-card-copy]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const card = getAlgCards().find(c => c.id === btn.getAttribute('data-card-copy'));
      if(!card) return;
      const text = card.alg || '';
      const onDone = ()=>{
        const orig = btn.textContent;
        btn.textContent = '✓';
        setTimeout(()=>{ btn.textContent = orig; }, 900);
      };
      const fallbackCopy = ()=>{
        try{
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          onDone();
        }catch(err){}
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(onDone).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    });
  });

  el.querySelectorAll('[data-card-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-card-delete');
      const cards = getAlgCards().filter(c => c.id !== id);
      saveAlgCards(cards);
      renderAlgCards();
    });
  });
}

function wireNotesPage(){
  renderAlgCards();

  const nameInput = document.getElementById('cardNameInput');
  const algInput = document.getElementById('cardAlgInput');
  const descInput = document.getElementById('cardDescInput');
  document.getElementById('cardAddBtn').addEventListener('click', ()=>{
    const name = nameInput.value.trim();
    const alg = algInput.value.trim();
    const desc = descInput.value.trim();
    if(!name && !alg){
      alert('Add at least a name or an algorithm.');
      return;
    }
    const addBtn = document.getElementById('cardAddBtn');
    const editingId = addBtn.getAttribute('data-editing-id');
    const cards = getAlgCards();
    if(editingId){
      const card = cards.find(c => c.id === editingId);
      if(card){ card.name = name; card.alg = alg; card.desc = desc; }
      addBtn.removeAttribute('data-editing-id');
      addBtn.textContent = 'Add card';
      document.getElementById('cardCancelEditBtn').style.display = 'none';
    } else {
      cards.push({ id: 'card_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), name, alg, desc });
    }
    saveAlgCards(cards);
    nameInput.value = ''; algInput.value = ''; descInput.value = '';
    renderAlgCards();
  });

  document.getElementById('cardCancelEditBtn').addEventListener('click', ()=>{
    const addBtn = document.getElementById('cardAddBtn');
    addBtn.removeAttribute('data-editing-id');
    addBtn.textContent = 'Add card';
    document.getElementById('cardCancelEditBtn').style.display = 'none';
    nameInput.value = ''; algInput.value = ''; descInput.value = '';
  });

  const ta = document.getElementById('notesTextarea');
  const indicator = document.getElementById('notesSavedIndicator');
  if(!ta) return;
  try{ ta.value = localStorage.getItem('learn-notes') || ''; }catch(e){}

  let saveTimer = null;
  ta.addEventListener('input', ()=>{
    indicator.textContent = 'Saving...';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      try{ localStorage.setItem('learn-notes', ta.value); }catch(e){}
      indicator.textContent = 'Saved';
      setTimeout(()=>{ if(indicator.textContent === 'Saved') indicator.textContent = ''; }, 1500);
    }, 400);
  });

  document.getElementById('notesCopyBtn').addEventListener('click', ()=>{
    const btn = document.getElementById('notesCopyBtn');
    const onDone = ()=>{
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(()=>{ btn.textContent = orig; }, 900);
    };
    const fallbackCopy = ()=>{
      try{
        ta.select();
        document.execCommand('copy');
        onDone();
      }catch(err){}
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(onDone).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  });

  document.getElementById('notesClearBtn').addEventListener('click', ()=>{
    if(!ta.value.trim() || confirm('Clear all your notes? This cannot be undone.')){
      ta.value = '';
      try{ localStorage.setItem('learn-notes', ''); }catch(e){}
    }
  });
}

function wireCompetitionsPage(){
  const countrySel = document.getElementById('compCountrySelect');
  const cityInput = document.getElementById('compCityFilter');
  const searchBtn = document.getElementById('compSearchBtn');
  const resultsEl = document.getElementById('compResults');

  try{
    const savedCountry = localStorage.getItem('learn-comp-country');
    if(savedCountry) countrySel.value = savedCountry;
  }catch(e){}

  function showFallback(country){
    resultsEl.innerHTML = `
      <div class="empty-note">
        We couldn't load competitions directly here right now.<br><br>
        <a href="https://www.worldcubeassociation.org/competitions" target="_blank" rel="noopener" style="color:var(--accent); font-weight:700;">View upcoming competitions on the official WCA site ↗</a>
        ${country ? '<br><span style="font-size:11px; color:var(--text-faint);">Select "' + country + '" in the region filter once there.</span>' : ''}
      </div>
    `;
  }

  async function doSearch(){
    const code = countrySel.value;
    if(!code){
      resultsEl.innerHTML = '<div class="empty-note">Pick a country above to search.</div>';
      return;
    }
    try{ localStorage.setItem('learn-comp-country', code); }catch(e){}
    const countryName = countrySel.options[countrySel.selectedIndex].textContent;
    resultsEl.innerHTML = '<div class="empty-note">Searching…</div>';

    const today = new Date().toISOString().slice(0,10);
    const url = 'https://www.worldcubeassociation.org/api/v0/competitions?country_iso2=' + encodeURIComponent(code) + '&start=' + today + '&sort=start_date';

    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('bad status ' + res.status);
      let comps = await res.json();
      if(!Array.isArray(comps)) throw new Error('unexpected response shape');

      const cityFilter = cityInput.value.trim().toLowerCase();
      if(cityFilter){
        comps = comps.filter(c => (c.city || '').toLowerCase().includes(cityFilter));
      }

      if(!comps.length){
        resultsEl.innerHTML = '<div class="empty-note">No upcoming competitions found' + (cityFilter ? ' matching "' + cityInput.value.trim() + '"' : '') + ' in ' + countryName + ' right now. Check back later, or browse the full WCA calendar.<br><br><a href="https://www.worldcubeassociation.org/competitions" target="_blank" rel="noopener" style="color:var(--accent); font-weight:700;">View full WCA calendar ↗</a></div>';
        return;
      }

      resultsEl.innerHTML = comps.slice(0, 20).map(c => `
        <div class="alg-line" style="flex-direction:column; align-items:stretch; gap:4px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
            <span class="alg-name" style="font-size:13px;">${(c.name || '').replace(/</g,'&lt;')}</span>
            <a href="https://www.worldcubeassociation.org/competitions/${c.id}" target="_blank" rel="noopener" style="font-size:11px; color:var(--accent); flex-shrink:0;">Details ↗</a>
          </div>
          <span style="font-size:12px; color:var(--text-dim);">${(c.city || '').replace(/</g,'&lt;')} · ${c.start_date || ''}${c.end_date && c.end_date !== c.start_date ? ' to ' + c.end_date : ''}</span>
        </div>
      `).join('');
    }catch(err){
      showFallback(countryName);
    }
  }

  searchBtn.addEventListener('click', doSearch);
  if(countrySel.value) doSearch();

  const WCA_EVENT_NAMES = {
    '222':'2x2', '333':'3x3', '333oh':'3x3 One-Handed', '333bf':'3x3 Blindfolded',
    '444':'4x4', '444bf':'4x4 Blindfolded', '555':'5x5', '555bf':'5x5 Blindfolded',
    '666':'6x6', '777':'7x7', 'pyram':'Pyraminx', 'skewb':'Skewb', 'minx':'Megaminx',
    'sq1':'Square-1', 'clock':'Clock', '333fm':'FMC', '333mbf':'Multi-Blind'
  };

  const wcaIdInput = document.getElementById('wcaIdInput');
  const wcaBtn = document.getElementById('wcaLookupBtn');
  const wcaResultEl = document.getElementById('wcaProfileResult');

  function wcaFallback(id){
    wcaResultEl.innerHTML = `
      <div class="empty-note">
        Couldn't load that profile's records directly here.<br><br>
        <a href="https://www.worldcubeassociation.org/persons/${encodeURIComponent(id)}" target="_blank" rel="noopener" style="color:var(--accent); font-weight:700;">View this profile on the official WCA site ↗</a>
      </div>
    `;
  }

  async function doWcaLookup(){
    const id = wcaIdInput.value.trim().toUpperCase();
    if(!id){
      wcaResultEl.innerHTML = '<div class="empty-note">Enter a WCA ID above (found on your WCA profile page).</div>';
      return;
    }
    wcaResultEl.innerHTML = '<div class="empty-note">Looking up…</div>';
    try{
      const res = await fetch('https://www.worldcubeassociation.org/api/v0/persons/' + encodeURIComponent(id));
      if(!res.ok) throw new Error('bad status ' + res.status);
      const data = await res.json();
      const person = data.person || data;
      if(!person || !person.name) throw new Error('unexpected response shape');

      let recordsHtml = '';
      const records = person.personal_records || (data.personal_records) || null;
      if(records && typeof records === 'object'){
        const rows = Object.entries(records).map(([eventCode, rec])=>{
          if(!rec) return '';
          const eventName = WCA_EVENT_NAMES[eventCode] || eventCode;
          const single = rec.single && rec.single.best ? formatWcaTime(rec.single.best) : null;
          const avg = rec.average && rec.average.best ? formatWcaTime(rec.average.best) : null;
          if(!single && !avg) return '';
          return `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); font-size:12.5px;">
            <span style="color:var(--text-faint);">${eventName}</span>
            <span style="color:var(--text-dim);">${single ? 'Single: ' + single : ''}${single && avg ? ' · ' : ''}${avg ? 'Avg: ' + avg : ''}</span>
          </div>`;
        }).filter(Boolean).join('');
        if(rows) recordsHtml = rows;
      }

      wcaResultEl.innerHTML = `
        <div class="alg-line" style="flex-direction:column; align-items:stretch; gap:6px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <span class="alg-name" style="font-size:14px;">${(person.name||'').replace(/</g,'&lt;')}</span>
            <a href="https://www.worldcubeassociation.org/persons/${encodeURIComponent(id)}" target="_blank" rel="noopener" style="font-size:11px; color:var(--accent);">Full profile ↗</a>
          </div>
          <span style="font-size:11px; color:var(--text-faint);">${id}${person.country_iso2 ? ' · ' + person.country_iso2 : ''}</span>
        </div>
        ${recordsHtml || '<div class="empty-note" style="margin-top:10px;">No official personal records on file yet.</div>'}
      `;
    }catch(err){
      wcaFallback(id);
    }
  }

  function formatWcaTime(centiseconds){
    if(typeof centiseconds !== 'number') return String(centiseconds);
    const totalSec = centiseconds / 100;
    if(totalSec < 60) return totalSec.toFixed(2) + 's';
    const min = Math.floor(totalSec / 60);
    const sec = (totalSec % 60).toFixed(2);
    return min + ':' + sec.padStart(5,'0');
  }

  wcaBtn.addEventListener('click', doWcaLookup);
}

function getTimerStore(){
  try{
    const raw = localStorage.getItem(TIMER_STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function wireTimerFavoritesSection(){
  const el = document.getElementById('timerFavoritesList');
  if(!el) return;
  const timerStore = getTimerStore();
  const favPatterns = (timerStore && timerStore.favPatterns) || {};
  const favScrambles = (timerStore && timerStore.favScrambles) || {};

  const patternEntries = [];
  Object.keys(favPatterns).forEach(puzzle=>{
    const names = favPatterns[puzzle] || [];
    const patternsForPuzzle = PATTERNS_BY_PUZZLE[puzzle] || [];
    names.forEach(name=>{
      const found = patternsForPuzzle.find(p=>p.name === name);
      if(found) patternEntries.push({ puzzle, name, alg: found.alg });
    });
  });
  const scrambleEntries = [];
  Object.keys(favScrambles).forEach(puzzle=>{
    (favScrambles[puzzle] || []).forEach(s=>{
      scrambleEntries.push({ puzzle, alg: s.scramble });
    });
  });

  if(!patternEntries.length && !scrambleEntries.length){
    el.innerHTML = '<div class="empty-note">Nothing starred in the Timer yet.</div>';
    return;
  }

  let html = '';
  patternEntries.forEach(e=>{
    html += `<div class="alg-line">
      <span class="alg-name">${e.name} <span style="color:var(--text-faint); font-weight:600;">— ${e.puzzle}</span></span>
      <span class="alg-code">${e.alg}</span>
    </div>`;
  });
  scrambleEntries.forEach(e=>{
    html += `<div class="alg-line">
      <span class="alg-name" style="min-width:70px;">${e.puzzle}</span>
      <span class="alg-code">${e.alg}</span>
    </div>`;
  });
  el.innerHTML = html;
}

function wire3x3Extras(){
  const f2lEl = document.getElementById('f2lList');
  if(f2lEl) f2lEl.innerHTML = F2L_BASIC.map(c=>algLine(c.c, c.a)).join('');

  const pllEl = document.getElementById('pllGrid');
  function renderPll(filter){
    if(!pllEl) return;
    const f = (filter||'').toLowerCase();
    const list = PLL_21.filter(p => !f || p.n.toLowerCase().includes(f) || p.d.toLowerCase().includes(f));
    pllEl.innerHTML = list.map(p=>`
      <div class="alg-card">
        <span class="num">${p.n}-perm</span>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">${p.d}</div>
        <div class="code">${p.a}</div>
      </div>
    `).join('');
  }
  renderPll('');
  const search = document.getElementById('pllSearch');
  if(search) search.addEventListener('input', ()=>renderPll(search.value));

  const ollToggle = document.getElementById('showOll');
  const ollGrid = document.getElementById('ollGrid');
  if(ollToggle){
    ollToggle.addEventListener('click', ()=>{
      const showing = ollGrid.style.display !== 'none';
      if(showing){
        ollGrid.style.display = 'none';
        ollToggle.textContent = 'Show all 57 OLL algorithms';
      } else {
        if(!ollGrid.dataset.built){
          ollGrid.className = 'alg-grid';
          ollGrid.innerHTML = OLL_57.map((alg,i)=>`
            <div class="alg-card">
              <span class="num">OLL ${i+1}</span>
              <div class="code">${alg}</div>
            </div>
          `).join('');
          ollGrid.dataset.built = '1';
        }
        ollGrid.style.display = 'grid';
        ollToggle.textContent = 'Hide the 57 OLL algorithms';
      }
    });
  }
}

document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', ()=> renderPage(el.getAttribute('data-page')));
});

document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.alg-copy-btn');
  if(!btn) return;
  const text = btn.getAttribute('data-copy-alg') || '';
  const onDone = ()=>{
    btn.classList.add('copied');
    const orig = btn.textContent;
    btn.textContent = '✓';
    setTimeout(()=>{ btn.classList.remove('copied'); btn.textContent = orig; }, 900);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onDone).catch(()=>{});
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); onDone(); }catch(err){}
    document.body.removeChild(ta);
  }
});

function getFavorites(){
  try{
    const raw = localStorage.getItem('learn-favorites');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveFavorites(list){
  try{ localStorage.setItem('learn-favorites', JSON.stringify(list)); }catch(e){}
}
function isFavorited(code){
  return getFavorites().some(f=>f.code === code);
}
function toggleFavorite(name, code){
  let favs = getFavorites();
  if(favs.some(f=>f.code === code)){
    favs = favs.filter(f=>f.code !== code);
  } else {
    favs.push({ name, code });
  }
  saveFavorites(favs);
  return isFavorited(code);
}

function markFavButtons(){
  document.querySelectorAll('.alg-fav-btn').forEach(btn=>{
    const code = btn.getAttribute('data-fav-code');
    const on = isFavorited(code);
    btn.classList.toggle('faved', on);
    btn.textContent = on ? '★' : '☆';
  });
}

document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.alg-fav-btn');
  if(!btn) return;
  const name = btn.getAttribute('data-fav-name') || '';
  const code = btn.getAttribute('data-fav-code') || '';
  toggleFavorite(name, code);
  markFavButtons();
  if(document.getElementById('favoritesList')) wireFavoritesPage();
});

const themeToggleBtn = document.getElementById('themeToggle');
function applyLearnTheme(){
  let saved = localStorage.getItem('learn-theme');
  if(!saved){
    const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    saved = prefersLight ? 'light' : 'dark';
  }
  const light = saved === 'light';
  document.documentElement.classList.toggle('light', light);
  themeToggleBtn.textContent = light ? '☀' : '☾';
  if(timerFrameRef){
    try{ timerFrameRef.contentWindow.postMessage({ type: 'sub-timer-theme', theme: light ? 'light' : 'dark' }, '*'); }catch(e){}
  }
}
applyLearnTheme();
themeToggleBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  const light = document.documentElement.classList.contains('light');
  localStorage.setItem('learn-theme', light ? 'dark' : 'light');
  applyLearnTheme();
});

const jumpTopBtn = document.getElementById('jumpTop');
window.addEventListener('scroll', ()=>{
  jumpTopBtn.classList.toggle('show', window.scrollY > 400);
});
jumpTopBtn.addEventListener('click', ()=>{
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('printPage').addEventListener('click', ()=>{
  window.print();
});

const fontSizeBtn = document.getElementById('fontSizeToggle');
function applyFontSize(){
  const large = localStorage.getItem('learn-large-text') === '1';
  document.documentElement.classList.toggle('large-text', large);
  fontSizeBtn.style.color = large ? 'var(--accent)' : '';
  fontSizeBtn.style.borderColor = large ? 'var(--accent)' : '';
}
applyFontSize();
fontSizeBtn.addEventListener('click', ()=>{
  const large = localStorage.getItem('learn-large-text') === '1';
  localStorage.setItem('learn-large-text', large ? '0' : '1');
  applyFontSize();
});

const collapseBtn = document.getElementById('sidebarCollapseToggle');
const shellEl = document.querySelector('.shell');
if(window.innerWidth <= 860) collapseBtn.style.display = 'flex';
window.addEventListener('resize', ()=>{
  collapseBtn.style.display = window.innerWidth <= 860 ? 'flex' : 'none';
});
collapseBtn.addEventListener('click', ()=>{
  shellEl.classList.toggle('sidebar-collapsed');
});

const copyAllAlgsBtn = document.getElementById('copyAllAlgs');
function updateCopyAllAlgsVisibility(){
  const lines = document.querySelectorAll('#main .alg-line');
  copyAllAlgsBtn.style.display = lines.length ? 'block' : 'none';
}
copyAllAlgsBtn.addEventListener('click', ()=>{
  const codes = [...document.querySelectorAll('#main .alg-line')].map(row=>{
    const name = row.querySelector('.alg-name')?.textContent.trim() || '';
    const code = row.querySelector('.alg-code')?.textContent.trim() || '';
    return name ? (name + ': ' + code) : code;
  });
  const text = codes.join('\n');
  const onDone = ()=>{
    const orig = copyAllAlgsBtn.textContent;
    copyAllAlgsBtn.textContent = '✓';
    setTimeout(()=>{ copyAllAlgsBtn.textContent = orig; }, 900);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onDone).catch(()=>{});
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); onDone(); }catch(e){}
    document.body.removeChild(ta);
  }
});

document.getElementById('sidebarSearch').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el=>{
    const label = el.textContent.trim().toLowerCase();
    const match = !q || label.includes(q);
    el.style.display = match ? '' : 'none';
  });
  document.querySelectorAll('.nav-group-title').forEach(title=>{
    let sib = title.nextElementSibling;
    let anyVisible = false;
    while(sib && sib.classList.contains('nav-item')){
      if(sib.style.display !== 'none') anyVisible = true;
      sib = sib.nextElementSibling;
    }
    title.style.display = (q && !anyVisible) ? 'none' : '';
  });
});

window.addEventListener('keydown', (e)=>{
  if(['SELECT','INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  const currentId = document.querySelector('.nav-item.active')?.getAttribute('data-page');
  if(!currentId) return;
  const idx = PAGE_ORDER.indexOf(currentId);
  if(idx === -1) return;
  if(e.key === '['){
    if(idx > 0) renderPage(PAGE_ORDER[idx-1]);
  } else if(e.key === ']'){
    if(idx < PAGE_ORDER.length-1) renderPage(PAGE_ORDER[idx+1]);
  }
});

let start = 'notation';
try{
  const saved = localStorage.getItem('learn-last-page');
  if(saved && (PAGES[saved] || saved === 'timer')) start = saved;
}catch(e){}
renderPage(start);

})();
